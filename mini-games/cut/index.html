<script>

// Plain functions shared with tools/check.js: no DOM. Every object is a list of polygons ("prims") in stage units,

// measured on a grid of CELL-sized cells filled from the very same polygons that are drawn.
const CELL=.25;
// One point lost per 0.25 % away from 50.0 : 50.0, so 49 : 51 is 96, 45 : 55 is 80 and 25 : 75 or worse is 0.
const POINTS_PER_PERCENT=4;
function smooth(pts,n=8){

  const out=[],L=pts.length;

      out.push([f(0),f(1)]);

}
function ellipsePts(cx,cy,rx,ry,rot=0,n=44){
  const out=[],co=Math.cos(rot*Math.PI/180),si=Math.sin(rot*Math.PI/180);

}
function capsulePts(x1,y1,x2,y2,w,n=7){

  for(let i=0;i<=n;i++){const b=a-Math.PI/2+Math.PI*i/n;out.push([x2+Math.cos(b)*r,y2+Math.sin(b)*r]);}
  for(let i=0;i<=n;i++){const b=a+Math.PI/2+Math.PI*i/n;out.push([x1+Math.cos(b)*r,y1+Math.sin(b)*r]);}

const poly=(fill,o,extra)=>({fill,o,h:null,...extra});
const disc=(fill,cx,cy,r,extra)=>poly(fill,ellipsePts(cx,cy,r,r),extra);

// A stroked arc as a row of short deco bars.
function arcBars(fill,cx,cy,r,a0,a1,w,n=6){

}
const mirror=right=>[...right,...right.slice().reverse().map(([x,y])=>[-x,y])];

function daikon(){
  const WHITE='#fbfbf4',EDGE='#cfd4c3',LEAF='#58b368',STEM='#a8d98a',VEIN='#3f8f52';

    oval(LEAF,-33,-122,15,50,-24),oval(LEAF,0,-134,16,56,0),oval(LEAF,35,-120,15,48,26),
    deco(bar(VEIN,-22,-96,-46,-152,2.5)),deco(bar(VEIN,0,-96,0,-176,2.5)),deco(bar(VEIN,24,-94,48,-150,2.5)),

}

function bicycle(){

  const prims=[],R=58,RA=[-86,46],FA=[86,46],BB=[-8,46],ST=[-28,-40],HT=[54,-46],HB=[62,-16];

  prims.push(poly(BASKET,[[64,-56],[118,-60],[110,-20],[70,-18]],{rim:WEAVE,rimW:3}));

// The five, in order. rot turns the drawing (degrees), fit is the box it is scaled into, in stage units.
const OBJECT_DEFS=[
  {id:'daikon',name:'大根',build:daikon,rot:36,fit:[290,318]},
  {id:'taiyaki',name:'たい焼き',build:taiyaki,rot:-7,fit:[316,220]},
  {id:'bike',name:'自転車',build:bicycle,rot:0,fit:[322,230]},
  {id:'tower',name:'東京スカイツリー',build:tower,rot:0,fit:[300,326]},
  {id:'fuji',name:'富士山',build:fuji,rot:0,fit:[344,220]},

const signedArea=p=>{let s=0;for(let i=0,n=p.length;i<n;i++){const a=p[i],b=p[(i+1)%n];s+=a[0]*b[1]-b[0]*a[1];}return s/2;};
function crossings(p,y){
  const xs=[];
  for(let i=0,n=p.length;i<n;i++){const a=p[i],b=p[(i+1)%n];if((a[1]<=y)!==(b[1]<=y))xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]));}

// The filled cells of the solid prims: centres in xs/ys, n of them.
function rasterize(prims){

const sadSound=()=>{tone('sawtooth',233,220,.22,.12);tone('sawtooth',175,150,.4,.12,.2);};

/* ---------- voices ---------- */
// One voice at a time: a line never cuts another. Queued lines wait their turn and are dropped once stale.
// Time here is the game clock T, which stops while the page is hidden.
let T=0, voiceUntil=0, speaker=null, bub=null, voiceQueue=[];
const lastSaid={};
const estimate=text=>clamp(.35+.11*text.replace('|','').length,.7,2.2);
function speak(who,id,shout) {
  const l=LINE[id], name='v_'+id+'_'+who, s=buffers[name]?.duration??estimate(l.text);
  try{speaker?.stop();}catch(_){}
  speaker=play(name,1);
  bub={who,text:l.text,shout:!!shout,until:T+Math.max(1.3,s+.5)};
  voiceUntil=T+s+.12;
  return s;
}
function say(who,id,{shout=false,queue=false,ttl=2.5}={}) {
  if(T<voiceUntil){if(queue)voiceQueue.push({who,id,shout,g:generation,exp:T+ttl});return false;}
  speak(who,id,shout);return true;
}
function pumpVoice() {
  while(voiceQueue.length&&T>=voiceUntil){const q=voiceQueue.shift();if(q.g===generation&&q.exp>=T)speak(q.who,q.id,q.shout);}
  if(bub&&T>=bub.until)bub=null;
}
function stopVoices() { try{speaker?.stop();}catch(_){} speaker=null;voiceUntil=0;voiceQueue=[];bub=null; }
function pickId(prefix) {
  const ids=group(prefix), options=ids.length>1?ids.filter(id=>id!==lastSaid[prefix]):ids;
  return lastSaid[prefix]=options[Math.floor(Math.random()*options.length)];
}
const other=w=>w==='h'?'b':'h', coin=()=>Math.random()<.5?'h':'b';

/* ---------- round ---------- */
let state='home', generation=0, hasStarted=false, hasDragged=false, timers=[];
let idx=0, phase='', phaseT=0, rounds=[], total=0, shownTotal=0, best=null, newBest=false;
let mood={h:'idle',b:'idle'}, fx=[], confetti=[], drag=null, shareFile=null, shareText='', resultT=0;
try{const b=Number(localStorage.getItem('cut.bestScore'));if(b>0)best=b;}catch(_){}
const after=(s,fn)=>timers.push({t:T+s,fn,g:generation});
function runTimers() {
  if(!timers.length)return;
  const due=timers.filter(x=>x.t<=T);if(!due.length)return;
  timers=timers.filter(x=>x.t>T);
  for(const x of due.sort((a,b)=>a.t-b.t))if(x.g===generation)x.fn();
}
const setMoods=(h,b)=>{mood.h=h;mood.b=b;};
const sumScore=()=>rounds.reduce((s,r)=>s+(r?r.score:0),0);
// The first game of a visit opens with the twins' two lines; a retry goes straight to the first drawing.
async function start() {
  initAudio();const first=!hasStarted, g=++generation;hasStarted=true;
  state='intro';rounds=[];fx=[];confetti=[];timers=[];drag=null;shareFile=null;idx=0;phase='';total=0;shownTotal=0;stopVoices();setMoods('idle','idle');
  for(const id of ['title','home','result'])show(id,false);
  $('save').style.display='none';$('tip').style.display='none';
  // The first tap creates the AudioContext; give the opening sounds a moment to decode.
  if(first&&ac){await Promise.race([Promise.all(['k_select_003','v_intro1_h','v_intro2_b'].map(n=>decoded[n])),new Promise(r=>setTimeout(r,500))]);if(g!==generation)return;}
  play('k_select_003',.7);
  const go=()=>{state='play';startRound(0);};
  if(first) {
    const s1=speak('h','intro1');setMoods('talk','idle');
    after(s1+.15,()=>{const s2=speak('b','intro2');setMoods('idle','talk');after(s2+.25,go);});
  } else go();
}
// One twin calls the drawing, the other answers while the player looks for the line.
function startRound(i) {
  idx=i;phase='enter';phaseT=T;setMoods('idle','idle');
  const l=LINE['call_'+OBJ[i].id], re=LINE['re_'+OBJ[i].id];
  say(l.who,l.id,{queue:true,ttl:3});say(re.who,re.id,{queue:true,ttl:5});
  tone('sine',300,520,.12,.12);
}
// The stroke becomes a line right across the stage; what counts is the area on each side of it.
function doCut(ax,ay,bx,by) {
  const o=OBJ[idx], l=cutLine(ax-ZONE.x,ay-ZONE.y,bx-ZONE.x,by-ZONE.y), tenths=tenthsOf(splitArea(o.mask,l));
  const r={...l,tenths,score:scoreOf(tenths),miss:tenths===0||tenths===1000};
  rounds[idx]=r;phase='reveal';phaseT=T;total=sumScore();
  // The answer to the call is dropped if it has not started: the cut is the news now.
  voiceQueue=[];
  slashSound();
  fx.push({kind:'slash',r,born:T,life:.3});
  const steps=REDUCED?0:10;
  for(let i=0;i<steps;i++)after(SEP_S+COUNT_S*i/steps,()=>tone('triangle',700+i*45,760+i*45,.04,.08));
  after(STAMP_AT,()=>judge(r));

}
function judge(r) {
  // The smaller piece's twin complains; when it is even, either cheers.
  const loser=r.tenths<500?'h':'b', winner=other(loser), band=bandOf(r.score), q={queue:true,ttl:1.2};
  const split=(l,w)=>setMoods(loser==='h'?l:w,loser==='b'?l:w);
  if(r.miss) {
    split('cry','grin');sadSound();
    if(Math.random()<.5)say(winner,'all0',{...q,shout:true});else say(loser,'none0',{...q,shout:true});
  } else if(band==='perfect') {
    setMoods('happy','happy');play('k_confirmation_001',.8);play('k_maximize_003',.5,1,.15);
    if(!REDUCED)for(let i=0;i<46;i++)confetti.push({x:rand(60,340),y:rand(110,320),vx:rand(-90,90),vy:rand(-220,-40),r:rand(3,6),life:rand(1,1.8),color:[RED,GOLD,BLUE,'#58b368'][i%4]});
    say(coin(),pickId('perfect'),{...q,shout:true});
  } else if(band==='great') {
    setMoods('smile','smile');play('k_confirmation_001',.6);say(coin(),pickId('great'),q);
  } else if(band==='ok') {
    split('sulk','smile');tone('sine',330,300,.25,.15);say(loser,pickId('ok'),q);
  } else if(band==='bad') {
    split('sulk','grin');sadSound();say(loser,pickId('bad'),{...q,shout:true});
  } else {
    split('cry','grin');sadSound();say(loser,pickId('terrible'),{...q,shout:true});
  }
}
function next() { if(idx+1<OBJ.length)startRound(idx+1);else finish(); }
function finish() {
  ++generation;timers=[];state='end';phase='';drag=null;total=sumScore();
  voiceUntil=0;voiceQueue=[];speak('h','end',true);setMoods('talk','idle');play('k_bong_001',.6,.8);
  after(1.2,reveal);
}
function reveal() {
  const g=generation;state='done';resultT=T;
  const [,line,m]=TOTAL_LINES.find(([min])=>total>=min);
  setMoods(m,m);voiceUntil=0;say(coin(),line,{shout:total>=450});
  play(total>=375?'k_confirmation_001':'k_maximize_003',.7);
  if(total>=450&&!REDUCED)for(let i=0;i<50;i++)confetti.push({x:rand(40,360),y:rand(20,200),vx:rand(-80,80),vy:rand(-160,-20),r:rand(3,6),life:rand(1.2,2.2),color:[RED,GOLD,BLUE,'#58b368'][i%4]});
  newBest=!CARD_MODE&&total>0&&(best===null||total>best);
  if(newBest){best=total;try{localStorage.setItem('cut.bestScore',String(best));}catch(_){}}
  shareText=LG(`ふたごに「富士山も、はんぶんこして」と言われた。\n5つ切って、合計${total}点（${MAX_TOTAL}点満点）\nあなたは、きっちり切れる？ ${HASHTAG}`,
    `쌍둥이가 "후지산도 반띵해 줘"래.\n5개 잘라서 합계 ${total}점 (${MAX_TOTAL}점 만점)\n너도 칼같이 자를 수 있어? ${HASHTAG}`,
    `Twins asked me to cut Mt. Fuji exactly in half.\nFive cuts: ${total} out of ${MAX_TOTAL}\nCan you split it fair? ${HASHTAG}`);
  $('share').href='https://x.com/intent/post?text='+encodeURIComponent(shareText)+'&url='+encodeURIComponent(URL_CARD);
  show('result',true);

}
$('go').onclick=start;$('again').onclick=start;
function tick(dt) {
  T+=dt;runTimers();pumpVoice();
  if(state==='play'&&phase==='enter'&&T-phaseT>=ENTER_S){phase='aim';phaseT=T;}
  if(state==='done')shownTotal=REDUCED?total:Math.round(total*(1-(1-clamp((T-resultT)/.9,0,1))**3));
  for(const p of confetti){p.vy+=320*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  confetti=confetti.filter(p=>p.life>0);
  fx=fx.filter(f=>T-f.born<f.life);
}

/* ---------- input ---------- */
// One stroke, the same with a finger and a mouse: press, draw the line, let go to cut. The line runs on past
// both ends, so the stroke can sit beside the drawing where the finger hides nothing.
const toStage=e=>[(e.clientX-ox)/scale,(e.clientY-oy)/scale];
const drawing=()=>state==='intro'||state==='play';
cv.addEventListener('pointerdown',e=>{
  if(!drawing()||drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();initAudio();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x,y]=toStage(e);drag={id:e.pointerId,x0:x,y0:y,x1:x,y1:y};
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  [drag.x1,drag.y1]=toStage(e);
});
cv.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  [drag.x1,drag.y1]=toStage(e);
  const d=drag;drag=null;
  if(state==='play'&&phase==='aim'&&Math.hypot(d.x1-d.x0,d.y1-d.y0)>=MIN_DRAG){hasDragged=true;doCut(d.x0,d.y0,d.x1,d.y1);}

for(const type of ['pointercancel','lostpointercapture'])cv.addEventListener(type,e=>{if(drag&&e.pointerId===drag.id)drag=null;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){drag=null;ac?.suspend().catch(()=>{});}
  else if(ac)ac.resume().catch(()=>{});
  show('paused',document.hidden&&state==='play');

/* ---------- art ---------- */
function txt(c,str,x,y,size,fill,o={}) {
  str=SP(str);c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);
  const font=o.font||DISPLAY;c.font=font.replace('X',size+'px');c.textAlign=o.align||'center';c.textBaseline='middle';c.lineJoin='round';
  if(o.maxW){const w=c.measureText(str).width;if(w>o.maxW){size*=o.maxW/w;c.font=font.replace('X',size+'px');}}
  if(o.stroke!==null){c.lineWidth=size*(o.sw??.18);c.strokeStyle=o.stroke||INK;c.strokeText(str,0,0);}
  c.fillStyle=fill;c.fillText(str,0,0);c.restore();
}
function rr(c,x,y,w,h,r) { c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath(); }
function ell(c,x,y,rx,ry,fill,lw=3) { c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(lw){c.lineWidth=lw;c.strokeStyle=INK;c.stroke();} }

function polyPath(c,pts) { c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath(); }
// The whole drawn shape as one path (nonzero): what gets cut, and what the deco is clipped to.
function unionPath(c,o) { c.beginPath();for(const p of o.prims)if(!p.deco){polyPath(c,p.o);if(p.h)polyPath(c,p.h);} }
function drawObject(c,o) {
  c.save();c.translate(3,4);unionPath(c,o);c.fillStyle='rgba(42,33,64,.16)';c.fill();c.restore();
  let clipped=false;
  for(const p of o.prims) {
    if(p.deco) {
      if(!clipped){c.save();unionPath(c,o);c.clip();clipped=true;}
      c.beginPath();polyPath(c,p.o);c.fillStyle=p.fill;c.fill();
      continue;
    }
    if(clipped){c.restore();clipped=false;}
    c.beginPath();polyPath(c,p.o);if(p.h)polyPath(c,p.h);c.fillStyle=p.fill;c.fill('evenodd');
    if(p.rim){c.save();c.clip('evenodd');c.lineWidth=p.rimW*2;c.strokeStyle=p.rim;c.lineJoin='round';c.stroke();c.restore();}
  }
  if(clipped)c.restore();
}
// Everything on one side of the cut: side -1 is the first piece, +1 the other.
function clipSide(c,r,side) {
  const R=900, dx=-r.ny, dy=r.nx, sx=r.nx*side*2*R, sy=r.ny*side*2*R;
  c.beginPath();c.moveTo(r.px-dx*R,r.py-dy*R);c.lineTo(r.px+dx*R,r.py+dy*R);c.lineTo(r.px+dx*R+sx,r.py+dy*R+sy);c.lineTo(r.px-dx*R+sx,r.py-dy*R+sy);c.closePath();c.clip();
}
// Object i at (cx,cy), scale k, with its cut r opened by e (0 closed, 1 fully apart). No cut: drawn whole.
function drawCut(c,i,cx,cy,k,r,e=1) {
  const o=OBJ[i];
  c.save();c.translate(cx,cy);c.scale(k,k);
  if(!r||r.miss)drawObject(c,o);
  else for(const side of [-1,1]) {
    c.save();c.translate(side*(r.nx*SEP_D+SEP_X)*e,side*r.ny*SEP_D*e);clipSide(c,r,side);drawObject(c,o);c.restore();
  }
  c.restore();
}
// Graph paper, drawn in screen space so it covers the whole window but lines up with the stage.
function drawPaper(c,w,h,k,x0,y0) {
  c.fillStyle=BG;c.fillRect(0,0,w,h);
  const step=20*k;
  for(let i=Math.floor(-x0/step);x0+i*step<w;i++){c.fillStyle=i%5?'rgba(59,130,214,.10)':'rgba(59,130,214,.22)';c.fillRect(Math.round(x0+i*step),0,1,h);}
  for(let j=Math.floor(-y0/step);y0+j*step<h;j++){c.fillStyle=j%5?'rgba(59,130,214,.10)':'rgba(59,130,214,.22)';c.fillRect(0,Math.round(y0+j*step),w,1);}
}
// A twin: head centre at (x,y). Moods: idle, talk, wow, smile, happy, grin, sulk, cry.
function drawTwin(c,who,x,y,m,t,talking) {
  const tw=TWINS[who], cheer=m==='happy'||m==='grin', sad=m==='sulk'||m==='cry';
  const hop=cheer&&!REDUCED?-Math.abs(Math.sin(t*7+(who==='h'?0:.8)))*7:0, bob=REDUCED?0:Math.sin(t*2.2+(who==='h'?0:1.7))*1.5;
  c.save();c.translate(x,y+bob+hop);c.lineJoin='round';c.lineCap='round';
  // Arms: up when cheering, down otherwise.
  for(const s of [-1,1]) {
    const hx=cheer?s*52:s*38, hy=cheer?4:(sad?80:74);
    c.beginPath();c.moveTo(s*24,54);c.lineTo(hx,hy);c.lineWidth=15;c.strokeStyle=INK;c.stroke();c.lineWidth=9;c.strokeStyle=tw.color;c.stroke();
    ell(c,hx,hy,7,7,SKIN,3);
  }
  // Body.
  c.beginPath();c.moveTo(-31,100);c.quadraticCurveTo(-35,40,-14,34);c.lineTo(14,34);c.quadraticCurveTo(35,40,31,100);c.closePath();
  c.fillStyle=tw.color;c.fill();c.lineWidth=3;c.strokeStyle=INK;c.stroke();

  if(who==='h'){c.save();c.translate(3,-44);c.rotate(.5);ell(c,0,-6,5,12,HAIR,3);c.restore();}
  // Cheeks.
  c.globalAlpha=.55;ell(c,-25,15,7,4.5,'#ff8fa0',0);ell(c,25,15,7,4.5,'#ff8fa0',0);c.globalAlpha=1;
  // Eyes.
  c.lineWidth=3.2;c.strokeStyle=INK;
  for(const s of [-1,1]) {
    const ex=s*15, ey=3;
    if(m==='happy'||m==='smile'||m==='grin'){c.beginPath();c.arc(ex,ey+4,6,Math.PI*1.15,Math.PI*1.85);c.stroke();}
    else if(m==='cry'){c.beginPath();c.moveTo(ex-s*6,ey-5);c.lineTo(ex+s*4,ey);c.lineTo(ex-s*6,ey+5);c.stroke();}
    else if(m==='sulk'){c.beginPath();c.moveTo(ex-6,ey);c.lineTo(ex+6,ey);c.stroke();c.beginPath();c.moveTo(ex-s*8,ey-11);c.lineTo(ex+s*5,ey-7);c.stroke();}
    else {const r=m==='wow'?6.5:5;ell(c,ex,ey-1.5,r,r,INK,0);ell(c,ex+1.6,ey-3.4,1.8,1.8,'#fff',0);}
  }
  // Tears.
  if(m==='cry'){c.fillStyle='#7fd0ff';for(const s of [-1,1]){const k=REDUCED?.5:(t*1.6+(s>0?.4:0))%1;c.beginPath();c.ellipse(s*19,12+k*22,3.5,5.5,0,0,Math.PI*2);c.fill();c.lineWidth=1.5;c.strokeStyle=INK;c.stroke();}}
  // Mouth.
  c.lineWidth=3;c.strokeStyle=INK;
  const open=talking&&!REDUCED?2+Math.abs(Math.sin(t*14))*5:0;
  if(m==='cry')ell(c,0,22,8,6+open*.5,'#b23a4a',3);
  else if(m==='happy')  {c.beginPath();c.moveTo(-10,17);c.quadraticCurveTo(0,34,10,17);c.closePath();c.fillStyle='#b23a4a';c.fill();c.stroke();}
  else if(m==='grin')   {c.beginPath();c.moveTo(-12,16);c.quadraticCurveTo(0,30,12,16);c.closePath();c.fillStyle='#fff';c.fill();c.stroke();}
  else if(m==='sulk')   {c.beginPath();c.moveTo(-7,24);c.quadraticCurveTo(0,17,7,24);c.stroke();}
  else if(m==='wow')    ell(c,0,22,4,5,'#b23a4a',3);
  else if(open)         ell(c,0,21,6,open,'#b23a4a',3);
  else                  {c.beginPath();c.moveTo(-7,19);c.quadraticCurveTo(0,26,7,19);c.stroke();}
  c.restore();
}
// The bubble has its own band of the stage, between the drawing and the twins' heads: nothing else is drawn
// there. It hangs on the speaker's side and its tail comes down onto the speaker's head. A line wider than the
// band shrinks to fit (none of the written ones does: tools/shots.sh checks every line for both twins).
const BUB={top:394,bottom:478,left:12,right:388,pad:20,tip:508};
function bubbleBox(c,b) {
  const lines=SP(b.text).split('|'), font=b.shout?DISPLAY:ROUND, room=BUB.right-BUB.left-2*BUB.pad;
  let size=b.shout?24:22;
  c.font=font.replace('X',size+'px');
  let tw=Math.max(...lines.map(l=>c.measureText(l).width));
  const natural=tw;
  if(tw>room){size*=room/tw;tw=room;}
  const lh=size*1.25, w=Math.max(132,tw+2*BUB.pad), h=lines.length*lh+22, s=b.who==='h'?-1:1;
  return {lines,font,size,lh,w,h,tw,natural,room,s,x:s<0?BUB.left:BUB.right-w,y:BUB.bottom-h,tx:TWINS[b.who].x-s*8};
}
function drawBubble(c) {
  if(!bub)return;
  const b=bubbleBox(c,bub), bb=b.y+b.h, tipX=TWINS[bub.who].x+b.s*2;
  c.lineJoin='round';c.lineCap='round';
  rr(c,b.x+1,b.y+5,b.w,b.h,18);c.fillStyle=INK;c.fill();
  rr(c,b.x,b.y,b.w,b.h,18);c.fillStyle='#fff';c.fill();c.lineWidth=3.5;c.strokeStyle=INK;c.stroke();
  // The tail is cut into the body: white over the outline where it joins, then only its two sides are drawn.
  c.beginPath();c.moveTo(b.tx-12,bb-6);c.lineTo(tipX,BUB.tip);c.lineTo(b.tx+12,bb-6);c.closePath();c.fillStyle='#fff';c.fill();
  c.beginPath();c.moveTo(b.tx-11,bb);c.lineTo(tipX,BUB.tip);c.lineTo(b.tx+11,bb);c.lineWidth=3.5;c.strokeStyle=INK;c.stroke();
  b.lines.forEach((l,i)=>txt(c,l,b.x+b.w/2,b.y+11+b.lh*(i+.5),b.size,bub.shout?RED:INK,{font:b.font,stroke:null}));
}
function drawTwins(c,t) {
  for(const who of ['h','b'])drawTwin(c,who,TWINS[who].x,TWIN_Y,mood[who],t,!!bub&&bub.who===who&&T<voiceUntil);
  drawBubble(c);
}
function drawHud(c) {
  const o=OBJ[idx];
  rr(c,10,10,48,30,15);c.fillStyle=INK;c.fill();
  txt(c,`${idx+1}/${OBJ.length}`,34,26,17,'#fff',{stroke:null});
  txt(c,o.name,66,26,25,INK,{align:'left',stroke:'#fff',sw:.22,maxW:196});
  txt(c,LG('合計','합계','Total'),392,15,11,GREY,{font:ROUND,align:'right',stroke:null});
  txt(c,PTS(total),392,31,21,RED,{align:'right',stroke:'#fff',sw:.22});
}
// The line under the finger: dashed right across the stage, solid along the stroke.
function drawGuide(c) {
  if(!drag||!(phase==='aim'||phase==='enter'||state==='intro'))return;
  const dx=drag.x1-drag.x0, dy=drag.y1-drag.y0, l=Math.hypot(dx,dy);
  c.lineCap='round';
  if(l>=MIN_DRAG) {
    const ux=dx/l, uy=dy/l, R=900;
    for(const [lw,col] of [[5,'rgba(255,255,255,.9)'],[2.2,INK]]){c.beginPath();c.setLineDash([9,8]);c.moveTo(drag.x0-ux*R,drag.y0-uy*R);c.lineTo(drag.x0+ux*R,drag.y0+uy*R);c.lineWidth=lw;c.strokeStyle=col;c.stroke();}
    c.setLineDash([]);
  }
  for(const [lw,col] of [[7,'#fff'],[3.5,l>=MIN_DRAG?RED:GREY]]){c.beginPath();c.moveTo(drag.x0,drag.y0);c.lineTo(drag.x1,drag.y1);c.lineWidth=lw;c.strokeStyle=col;c.stroke();}
  ell(c,drag.x0,drag.y0,5,5,'#fff',2.5);ell(c,drag.x1,drag.y1,5,5,l>=MIN_DRAG?RED:GREY,2.5);
}
// First object of a visit: a ghost stroke shows the gesture until the player has made one.
function drawDemo(c) {
  if(hasDragged||drag||idx!==0||phase!=='aim')return;
  if(!REDUCED) {
    const k=(T-phaseT)*.55%1, e=clamp(k*1.5,0,1), a=[84,100], b=[318,344], x=a[0]+(b[0]-a[0])*e, y=a[1]+(b[1]-a[1])*e;
    c.save();c.globalAlpha=k>.8?(1-k)/.2*.7:.7;c.lineCap='round';
    c.beginPath();c.setLineDash([9,8]);c.moveTo(a[0],a[1]);c.lineTo(x,y);c.lineWidth=3;c.strokeStyle=INK;c.stroke();c.setLineDash([]);
    ell(c,x,y,13,13,'rgba(255,255,255,.85)',3);
    c.restore();
  }
  // The hint sits between the twins, where the two shares will show.
  txt(c,LG(TOUCH?'スーッとなぞって':'スーッとドラッグで',TOUCH?'쭉 그어서':'쭉 드래그해서',TOUCH?'Swipe a line':'Drag a line'),200,TWIN_Y-10,16,INK,{font:ROUND,stroke:'#fff',sw:.3});
  txt(c,LG('まっぷたつ！','싹둑!','to cut it in two!'),200,TWIN_Y+12,16,INK,{font:ROUND,stroke:'#fff',sw:.3});
}
const splitText=r=>`${(r.tenths/10).toFixed(1)} : ${((1000-r.tenths)/10).toFixed(1)}`;
function drawPlay(c) {
  drawHud(c);
  const o=OBJ[idx], r=rounds[idx], k=T-phaseT;
  if(phase==='enter') {
    const e=REDUCED?1:clamp(k/ENTER_S,0,1), back=1+2.2*(e-1)**3+1.2*(e-1)**2;
    c.save();c.translate(ZONE.x,ZONE.y-(1-back)*320);c.rotate((1-e)*-.25);drawObject(c,o);c.restore();
  } else if(phase==='aim') {
    c.save();c.translate(ZONE.x,ZONE.y);drawObject(c,o);c.restore();
    drawDemo(c);
  } else if(phase==='reveal'&&r) {
    drawCut(c,idx,ZONE.x,ZONE.y,1,r,easeOut(clamp(k/SEP_S,0,1)));
    if(k>=SEP_S||REDUCED) {
      // Both shares count away from 50.0 to what the cut really gave, between the twins: ハン's on the left.
      const e=REDUCED?1:easeOut(clamp((k-SEP_S)/COUNT_S,0,1)), a=Math.round(500+(r.tenths-500)*e);
      txt(c,(a/10).toFixed(1)+'%',193,TWIN_Y-22,22,RED,{align:'right',stroke:'#fff',sw:.24,maxW:66});
      txt(c,':',200,TWIN_Y-24,20,INK,{stroke:null});
      txt(c,((1000-a)/10).toFixed(1)+'%',207,TWIN_Y-22,22,BLUE,{align:'left',stroke:'#fff',sw:.24,maxW:66});
    }
    if(k>=STAMP_AT) {
      const p=REDUCED?1:clamp((k-STAMP_AT)/.18,0,1), band=bandOf(r.score), word=r.miss?MISS_WORD:STAMP_WORD[band], top=band==='perfect';
      c.save();c.translate(200,352);c.scale(1.5-.5*p,1.5-.5*p);c.globalAlpha=p;
      if(word)txt(c,word,0,-44,24,top?GOLD:'#fff',{rot:-.05});
      txt(c,PTS(r.score),0,0,top?58:52,top?GOLD:r.score>=75?'#fff':'#c9c4d6',{rot:-.05});
      c.restore();
    }
  }
  for(const f of fx)if(f.kind==='slash') {
    const a=1-(T-f.born)/f.life, R=420, x=ZONE.x+f.r.px, y=ZONE.y+f.r.py, dx=-f.r.ny, dy=f.r.nx;
    c.save();c.globalAlpha=a;c.lineCap='round';c.beginPath();c.moveTo(x-dx*R,y-dy*R);c.lineTo(x+dx*R,y+dy*R);c.lineWidth=2+7*a;c.strokeStyle='#fff';c.stroke();c.restore();
  }
  drawGuide(c);
}
// One paper tile of the result: the drawing as it was cut, its name, the split and the points.
function drawCell(c,i,[x,y,w,h],f) {
  const r=rounds[i], o=OBJ[i], th=52*f;
  rr(c,x+2*f,y+3*f,w,h,10*f);c.fillStyle=INK;c.fill();
  rr(c,x,y,w,h,10*f);c.fillStyle=CREAM;c.fill();c.lineWidth=2.5*f;c.strokeStyle=INK;c.stroke();
  const aw=w-12*f, ah=h-th-8*f, k=Math.min(aw/(o.w+2*(SEP_D+SEP_X)+8),ah/(o.h+2*SEP_D+8));
  if(r)drawCut(c,i,x+w/2,y+5*f+ah/2,k,r,1);
  else {c.save();c.translate(x+w/2,y+5*f+ah/2);c.scale(k,k);drawObject(c,o);c.restore();}
  const cx=x+w/2, by=y+h-th;
  txt(c,o.name,cx,by+7*f,13.5*f,INK,{font:ROUND,stroke:null,maxW:w-10*f});
  if(r){
    txt(c,splitText(r),cx,by+22*f,12*f,GREY,{font:ROUND,stroke:null,maxW:w-10*f});
    txt(c,PTS(r.score),cx,by+39*f,20*f,bandOf(r.score)==='perfect'?'#e2a100':RED,{stroke:null,maxW:w-10*f});
  }
}
// The result board in the stage: the total on top, the five cuts below (the tower gets the tall tile).
const BOARD=[[8,100,146,140],[160,100,146,140],[8,248,146,140],[312,100,80,288],[160,248,146,140]];
function drawBoard(c) {
  txt(c,LG('5つ切って、合計','5개 자른 합계','Total for 5 cuts'),200,16,14,INK,{font:ROUND,stroke:null});
  // The number, its unit and "/ 500" as one row centred on the stage.
  const unit=LG('点','점','pts'), rest='/ '+MAX_TOTAL, n=String(shownTotal), wid=(str,f)=>{c.font=f;return c.measureText(SP(str)).width;};
  const wn=wid(n,DISPLAY.replace('X','50px')), wu=wid(unit,DISPLAY.replace('X','24px')), wr=wid(rest,ROUND.replace('X','14px'));
  const x0=KO||EN?200-(wn+4+wu+8+wr)/2:182-wn/2, xu=x0+wn+(KO||EN?4:3), xr=KO||EN?xu+wu+8:182+wn/2+58-wr/2;
  txt(c,n,x0,52,50,RED,{align:'left',stroke:'#fff',sw:.2});
  txt(c,unit,xu,59,24,RED,{align:'left',stroke:'#fff',sw:.24});
  txt(c,rest,xr,62,14,GREY,{align:'left',font:ROUND,stroke:null});
  if(best)txt(c,(newBest?LG('新記録！ ','신기록! ','New best! '):'')+LG(`自己ベスト ${best}点`,`최고 기록 ${best}점`,`Your best: ${best} pts`),200,86,12.5,newBest?RED:GREY,{font:ROUND,stroke:null});
  OBJ.forEach((o,i)=>drawCell(c,i,BOARD[i],1));
}
// The whole stage; also drawn straight into pictures.
function drawScene(c,t) {
  if(state==='play')drawPlay(c);
  if(state==='intro')drawGuide(c);
  if(state==='end')txt(c,LG('おしまい！','끝!','All done!'),200,ZONE.y,56,GOLD,{rot:-.05});
  if(state==='done')drawBoard(c);
  drawTwins(c,t);
  for(const p of confetti){c.fillStyle=p.color;c.fillRect(p.x-p.r,p.y-p.r*.5,p.r*2,p.r);}
}
function draw(dt) {
  if(layoutState!==state)resize();
  easeLayout(dt);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawPaper(ctx,innerWidth,innerHeight,scale,ox,oy);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,ox*dpr,oy*dpr);
  drawScene(ctx,T);
}
let lastFrame=0;
function frame(now) {
  const dt=Math.min(.05,(now-lastFrame)/1000||.016);lastFrame=now;
  if(!document.hidden&&!CARD_MODE)tick(dt);
  if(!document.hidden||CARD_MODE)draw(dt);
  requestAnimationFrame(frame);
}

/* ---------- share picture ---------- */
// 1200x675. kind 'result': the player's own five cuts and total. 'card' and 'thumb': the five drawings with a
// dotted line each, for the link preview and the page thumbnail.
async function drawShareImage(kind) {
  const LATIN='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,:!?%/\'… ';
  await document.fonts?.load('60px "Dela Gothic One"','きっちりはんぶんこ5つ切って、合計何点？あなたは点満点0123456789.:%大根たい焼き自転車東京スカイツリー富士山ハンブンふたごなんでも半分'+LATIN);
  await document.fonts?.load('800 30px "M PLUS Rounded 1c"','大根たい焼き自転車東京スカイツリー富士山0123456789.: '+LATIN);
  const c=document.createElement('canvas');c.width=1200;c.height=675;
  const x=c.getContext('2d');
  drawPaper(x,1200,675,2,0,7);
  // The twins look over the bottom edge.
  for(const [who,tx] of [['h',96],['b',1104]]){x.save();x.translate(tx,612);x.scale(1.25,1.25);drawTwin(x,who,0,0,kind==='result'?mood[who]:'happy',0,false);x.restore();}
  // The title: the first word in ink, the second in red, as on the page.
  const [t1,t2]=LG(['きっちり','はんぶんこ'],['칼같이','반띵'],['Exactly','Halfsies']);
  x.font=DISPLAY.replace('X','50px');const w1=EN||KO?x.measureText(SP(t1)).width+22:218;
  txt(x,t1,40,66,50,INK,{align:'left',stroke:'#fff',sw:.2});
  txt(x,t2,40+w1,66,60,RED,{align:'left',sw:.14});
  const cols=OBJ.map((o,i)=>[30+i*230,138,220,kind==='result'?400:330]);
  if(kind==='result') {
    // The total and its two labels share the row right of the title; the number shrinks when they would meet it.
    const l1=LG('5つ切って、合計','5개 자른 합계','Total for 5 cuts'), l2=LG(MAX_TOTAL+'点満点',MAX_TOTAL+'점 만점','out of '+MAX_TOTAL);
    x.font=DISPLAY.replace('X','60px');const titleEnd=40+w1+x.measureText(SP(t2)).width;
    x.font=ROUND.replace('X','26px');let wl=x.measureText(SP(l1)).width;x.font=ROUND.replace('X','22px');wl=Math.max(wl,x.measureText(SP(l2)).width);
    const n=PTS(total);x.font=DISPLAY.replace('X','84px');let wn=x.measureText(SP(n)).width, ns=84;
    const room=1170-14-wl-(titleEnd+28);if(wn>room){ns=84*room/wn;wn=room;}
    txt(x,n,1170,62,ns,RED,{align:'right',stroke:'#fff',sw:.16});
    txt(x,l1,1170-wn-14,48,26,INK,{font:ROUND,align:'right',stroke:null});
    txt(x,l2,1170-wn-14,84,22,GREY,{font:ROUND,align:'right',stroke:null});
    OBJ.forEach((o,i)=>drawCell(x,i,cols[i],2));
    txt(x,LG('あなたは何点？','넌 몇 점?','What\'s your score?'),600,612,50,INK,{stroke:'#fff',sw:.2});
  } else {
    txt(x,kind==='card'?LG('あなたは何点？','넌 몇 점?','What\'s your score?'):LG('ふたごは、なんでも半分こ','쌍둥이는 뭐든지 반띵','The twins split everything'),1170,64,34,INK,{font:ROUND,align:'right',stroke:'#fff',sw:.25,maxW:480});
    const keep=rounds;rounds=[];
    OBJ.forEach((o,i)=>{
      drawCell(x,i,cols[i],2);
      const [cx,cy,w,h]=cols[i], a=[-.5,.35,-.2,1.45,.6][i], mx=cx+w/2, my=cy+12+(h-130)/2, R=130;
      x.save();x.beginPath();x.rect(cx+6,cy+6,w-12,h-130);x.clip();x.lineCap='round';
      for(const [lw,col] of [[9,'#fff'],[4,INK]]){x.beginPath();x.setLineDash([14,12]);x.moveTo(mx-Math.cos(a)*R,my-Math.sin(a)*R);x.lineTo(mx+Math.cos(a)*R,my+Math.sin(a)*R);x.lineWidth=lw;x.strokeStyle=col;x.stroke();}
      x.restore();x.setLineDash([]);
      txt(x,LG('？点','?점','? pts'),cx+w/2,cy+h-34,40,RED,{stroke:null});
    });
    rounds=keep;
    txt(x,LG('5つ切って、合計何点？','5개 잘라서 합계 몇 점?','5 cuts. Your total?'),600,560,66,RED,{sw:.14,maxW:840});
    txt(x,LG('ぴったり半分で100点。500点満点！','딱 반이면 100점. 500점 만점!','Exactly half scores 100. 500 is the max!'),600,632,32,INK,{font:ROUND,stroke:'#fff',sw:.25,maxW:860});
  }
  return new Promise(res=>c.toBlob(res,'image/png'));
}
async function prepareShare(g) {
  try {
    const blob=await drawShareImage('result');
    if(g!==generation||!blob)return;
    shareFile=new File([blob],LG('kicchiri-hanbunko.png','kalgachi-bandding.png','exactly-halfsies.png'),{type:'image/png'});
    // Phones that can share files: the picture is the main way to post, so its button leads.
    const sheet=canShareFile();
    $('save').textContent=sheet?LG('画像でシェア','이미지로 공유','Share picture'):LG('画像を保存','이미지 저장','Save picture');
    $('save').className=sheet?'':'alt';
    $('save').style.display=TOUCH?'inline-flex':'none';
  } catch(err) { console.warn('share image',err); }
}
const canShareFile=()=>!!(TOUCH&&shareFile&&navigator.canShare&&navigator.share&&navigator.canShare({files:[shareFile]}));
function download() {
  const a=document.createElement('a'), url=URL.createObjectURL(shareFile);
  a.href=url;a.download=shareFile.name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function note(text) { const el=$('tip');el.textContent=text;el.style.display='block'; }
// On PC the picture goes to the clipboard first (⌘V / Ctrl+V into the post), falling back to a download;
// X opens after the copy, while the page still has focus.
if(!TOUCH)$('share').innerHTML=LG('Xでポスト<small>画像もコピー</small>','X에 올리기<small>이미지도 복사</small>','Post on X<small>Copies the picture too</small>');
$('share').addEventListener('click',async e=>{
  if(TOUCH||!shareFile)return;
  e.preventDefault();
  const href=$('share').href, paste=/Mac/.test(navigator.platform)?'⌘V':'Ctrl+V';
  try {
    await navigator.clipboard.write([new ClipboardItem({'image/png':shareFile})]);
    note(LG(`リンクにカードが付きます。自分の結果の画像も付けるなら ${paste}`,`링크에 카드가 붙어요. 내 결과 이미지도 넣으려면 ${paste}`,`Your link comes with a preview card. Want your result picture in the post too? Press ${paste}`));
  } catch(err) { console.warn('clipboard',err);download();note(LG('画像を保存しました。投稿に添付してください','이미지를 저장했어요. 게시물에 첨부해 주세요','Picture saved. Attach it to your post!')); }
  window.open(href,'_blank','noopener');
});
$('save').addEventListener('click',e=>{
  e.currentTarget.blur();
  if(!shareFile)return;
  if(!canShareFile())return download();
  navigator.share({files:[shareFile],text:shareText,url:URL_PUBLIC+LG('','?hl=ko','?hl=en')}).catch(err=>{
    if(err.name!=='AbortError'){console.warn('share',err);download();}   // AbortError: the sheet was closed
  });
});
function showPicture(blob) {
  const i=new Image();i.id='preview';i.src=URL.createObjectURL(blob);
  i.style.cssText='position:fixed;left:0;top:0;width:1200px;height:675px;z-index:99';document.body.append(i);
}

/* ---------- boot ---------- */
// ?card draws the thumbnail, ?card=card the link preview, ?card=result a sample result picture. Card mode
// never touches the record.
const query=new URLSearchParams(location.search), CARD_MODE=query.has('card');
resize();
bub={who:'h',text:LINE.intro1.text,shout:false,until:Infinity};
requestAnimationFrame(frame);
if(CARD_MODE) {
  show('home',false);show('title',false);bub=null;
  const kind=query.get('card')||'thumb';
  if(kind==='result') {
    // A plausible game: near-bisecting cuts at a few angles.
    rounds=OBJ.map((o,i)=>{const l=bisector(o.mask,[62,80,95,4,100][i]),off=[2,-5,9,-14,1][i];l.px+=l.nx*off;l.py+=l.ny*off;const tenths=tenthsOf(splitArea(o.mask,l));return {...l,tenths,score:scoreOf(tenths),miss:false};});
    total=sumScore();setMoods('happy','smile');
  }
  setTimeout(()=>drawShareImage(kind==='result'?'result':kind==='card'?'card':'thumb').then(showPicture),300);
}
