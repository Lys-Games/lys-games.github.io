<div id="ui" class="ui-box">

<script>
'use strict';
/* PHYSICS-BEGIN */
// Plain functions shared with tools/sim.js: no DOM, no audio. Stage units (400 wide), y points down.
// Rigid bodies after Box2D-lite: boxes (cups, shelves) and one circle (the pearl in flight), sequential impulses
// with warm starting, so a pyramid of cups stands still until something hits it.
const GRAV=900, SUBSTEPS=2, ITER=10, SLOP=.4, BIAS=.2;
const CUP_W=24, CUP_H=32, CUP_M=1, CUP_FRICTION=.5;
const PEARL_R=7, PEARL_M=4, PEARL_FRICTION=.3, PEARL_BOUNCE=.3;
// Shelves are static boxes; y is the top surface. The high one sits behind and above the low one.
const SHELF_T=12;
const SHELVES=[{x0:178,x1:340,y:432},{x0:286,x1:398,y:262}];
const DEG=Math.PI/180, AIM_MIN=8*DEG, AIM_MAX=84*DEG, AIM_START=42*DEG;
// The shooter, seen from the side: the head turns about NECK with the aim (TILT of the aim's swing) and the pearl
// leaves the mouth along the aim. MOUTH_OFF is the mouth relative to the neck with the head level.
const NECK={x:58,y:462}, MOUTH_OFF={x:56,y:-40}, AIM_MID=40*DEG, TILT=.55;
const headTilt=aim=>(aim-AIM_MID)*TILT, STRAW_W=12;
// Holding slurps a pearl up the straw: power grows to full over CHARGE_S, then the pearl waits at the lip for
// GRACE_S (still full power). Hold past that and it is swallowed: COUGH_S of coughing, and that pearl is lost.
const CHARGE_S=.9, GRACE_S=.22, COUGH_S=1.1;
// Launch speed from power 0..1.
const V_MIN=180, V_MAX=700;
// Every game has the same ammunition so scores compare.
const PEARLS=10;
// The shelf sets, in order: when every cup of a set has left its shelf the next one appears after SET_DELAY.
// Each pyramid: shelf index, rows (bottom row has that many cups) and centre x.
const SETS=[
  [{shelf:0,rows:3,x:262}],
  [{shelf:0,rows:4,x:258}],
  [{shelf:0,rows:2,x:226},{shelf:1,rows:3,x:345}],
  [{shelf:0,rows:3,x:250},{shelf:1,rows:4,x:342}],
];
const SET_DELAY=.9;
// Score: 100 per cup off its shelf, a bonus per cleared set, and only when every set is cleared, LEFT_PTS per
// pearl still in the cup.
const CUP_PTS=100, CLEAR_PTS=[300,500,700,1000], LEFT_PTS=300;
// A shot "hits" when at least one cup leaves its shelf before the next shot.
const clampN=(n,a,b)=>Math.max(a,Math.min(b,n));
const totalCups=()=>SETS.reduce((n,s)=>n+s.reduce((m,p)=>m+p.rows*(p.rows+1)/2,0),0);
function muzzle(aim){
  const t=headTilt(aim), c=Math.cos(t), s=Math.sin(t);
  return {x:NECK.x+c*MOUTH_OFF.x+s*MOUTH_OFF.y,y:NECK.y-s*MOUTH_OFF.x+c*MOUTH_OFF.y};
}
const powerOf=hold=>clampN(hold/CHARGE_S,0,1);
const speedOf=p=>V_MIN+(V_MAX-V_MIN)*p;

function boxBody(kind,x,y,hw,hh,m,f){
  const b={id:0,kind,x,y,a:0,vx:0,vy:0,w:0,hw,hh,r:0,m,im:m?1/m:0,I:0,iI:0,f,bound:Math.hypot(hw,hh)};
  if(m){b.I=m*(4*hw*hw+4*hh*hh)/12;b.iI=1/b.I;}
  return b;
}
function circleBody(kind,x,y,r,m,f){
  const b={id:0,kind,x,y,a:0,vx:0,vy:0,w:0,hw:0,hh:0,r,m,im:1/m,I:m*r*r/2,iI:0,f,bound:r};
  b.iI=1/b.I;return b;
}
function addBody(w,b){b.id=w.nextId++;w.bodies.push(b);return b;}
function removeBody(w,b){
  w.bodies.splice(w.bodies.indexOf(b),1);
  for(const [k,a] of w.arbs)if(a.b1===b||a.b2===b)w.arbs.delete(k);
}

// Box-box contacts (separating axis, then the incident edge clipped against the reference face's sides).
// Normal points from A to B. Feature keys let the solver carry impulses from one step to the next.
function incidentEdge(b,nx,ny){
  const c=Math.cos(b.a), s=Math.sin(b.a), lx=-(c*nx+s*ny), ly=-(-s*nx+c*ny), hw=b.hw, hh=b.hh;
  let v;
  if(Math.abs(lx)>Math.abs(ly)) v=lx>=0?[hw,-hh,3,4,hw,hh,4,1]:[-hw,hh,1,2,-hw,-hh,2,3];
  else v=ly>=0?[hw,hh,4,1,-hw,hh,1,2]:[-hw,-hh,2,3,hw,-hh,3,4];
  return [0,4].map(i=>({x:b.x+c*v[i]-s*v[i+1],y:b.y+s*v[i]+c*v[i+1],i1:0,o1:0,i2:v[i+2],o2:v[i+3]}));
}
function clipSeg(p0,p1,nx,ny,off,edge){
  const d0=nx*p0.x+ny*p0.y-off, d1=nx*p1.x+ny*p1.y-off, out=[];
  if(d0<=0)out.push(p0);
  if(d1<=0)out.push(p1);
  if(d0*d1<0){
    const k=d0/(d0-d1), src=d0>0?p0:p1, q={x:p0.x+k*(p1.x-p0.x),y:p0.y+k*(p1.y-p0.y),i1:src.i1,o1:src.o1,i2:src.i2,o2:src.o2};
    if(d0>0){q.i1=edge;q.i2=0;}else{q.o1=edge;q.o2=0;}
    out.push(q);
  }
  return out;
}
function collideBoxes(A,B,out){
  const cA=Math.cos(A.a), sA=Math.sin(A.a), cB=Math.cos(B.a), sB=Math.sin(B.a);
  const dpx=B.x-A.x, dpy=B.y-A.y;
  const dAx=cA*dpx+sA*dpy, dAy=-sA*dpx+cA*dpy, dBx=cB*dpx+sB*dpy, dBy=-sB*dpx+cB*dpy;
  const a11=Math.abs(cA*cB+sA*sB), a12=Math.abs(-cA*sB+sA*cB), a21=Math.abs(-sA*cB+cA*sB), a22=a11;
  const fAx=Math.abs(dAx)-A.hw-(a11*B.hw+a12*B.hh), fAy=Math.abs(dAy)-A.hh-(a21*B.hw+a22*B.hh);
  if(fAx>0||fAy>0)return;
  const fBx=Math.abs(dBx)-(a11*A.hw+a21*A.hh)-B.hw, fBy=Math.abs(dBy)-(a12*A.hw+a22*A.hh)-B.hh;
  if(fBx>0||fBy>0)return;
  let axis=0, sep=fAx, nx=dAx>0?cA:-cA, ny=dAx>0?sA:-sA;
  if(fAy>.95*sep+.01*A.hh){axis=1;sep=fAy;nx=dAy>0?-sA:sA;ny=dAy>0?cA:-cA;}
  if(fBx>.95*sep+.01*B.hw){axis=2;sep=fBx;nx=dBx>0?cB:-cB;ny=dBx>0?sB:-sB;}
  if(fBy>.95*sep+.01*B.hh){axis=3;sep=fBy;nx=dBy>0?-sB:sB;ny=dBy>0?cB:-cB;}
  let fnx=nx, fny=ny, front, snx, sny, sideH, negEdge, posEdge, inc, ref;
  if(axis<2){ref=A;inc=B;}else{ref=B;inc=A;fnx=-nx;fny=-ny;}
  const c=Math.cos(ref.a), s=Math.sin(ref.a);
  if(axis%2===0){front=ref.x*fnx+ref.y*fny+ref.hw;snx=-s;sny=c;sideH=ref.hh;negEdge=3;posEdge=1;}
  else{front=ref.x*fnx+ref.y*fny+ref.hh;snx=c;sny=s;sideH=ref.hw;negEdge=2;posEdge=4;}
  const side=ref.x*snx+ref.y*sny, e=incidentEdge(inc,fnx,fny);
  const c1=clipSeg(e[0],e[1],-snx,-sny,-side+sideH,negEdge);if(c1.length<2)return;
  const c2=clipSeg(c1[0],c1[1],snx,sny,side+sideH,posEdge);if(c2.length<2)return;
  for(const p of c2){
    const d=fnx*p.x+fny*p.y-front;
    if(d<=0)out.push({x:p.x-d*fnx,y:p.y-d*fny,nx,ny,sep:d,key:axis<2?p.i1|p.o1<<4|p.i2<<8|p.o2<<12:p.i2|p.o2<<4|p.i1<<8|p.o1<<12,Pn:0,Pt:0});
  }
}
// Box A, circle B: one contact, normal from the box to the circle.
function collideCircle(A,B,out){
  const c=Math.cos(A.a), s=Math.sin(A.a), dx=B.x-A.x, dy=B.y-A.y, lx=c*dx+s*dy, ly=-s*dx+c*dy;
  const qx=clampN(lx,-A.hw,A.hw), qy=clampN(ly,-A.hh,A.hh);
  let nlx, nly, sep, px, py;
  if(qx===lx&&qy===ly){
    const ex=A.hw-Math.abs(lx), ey=A.hh-Math.abs(ly);
    if(ex<ey){nlx=lx<0?-1:1;nly=0;sep=-ex-B.r;px=nlx*A.hw;py=ly;}else{nlx=0;nly=ly<0?-1:1;sep=-ey-B.r;px=lx;py=nly*A.hh;}
  } else {
    const ex=lx-qx, ey=ly-qy, d=Math.hypot(ex,ey);
    if(d>B.r)return;
    nlx=ex/d;nly=ey/d;sep=d-B.r;px=qx;py=qy;
  }
  out.push({x:A.x+c*px-s*py,y:A.y+s*px+c*py,nx:c*nlx-s*nly,ny:s*nlx+c*nly,sep,key:0,Pn:0,Pt:0});
}
function preStep(a,invDt){
  const b1=a.b1, b2=a.b2;
  for(const c of a.c){
    const r1x=c.x-b1.x, r1y=c.y-b1.y, r2x=c.x-b2.x, r2y=c.y-b2.y, nx=c.nx, ny=c.ny, tx=ny, ty=-nx;
    const rn1=r1x*nx+r1y*ny, rn2=r2x*nx+r2y*ny, rt1=r1x*tx+r1y*ty, rt2=r2x*tx+r2y*ty;
    c.r1x=r1x;c.r1y=r1y;c.r2x=r2x;c.r2y=r2y;
    c.mn=1/(b1.im+b2.im+b1.iI*(r1x*r1x+r1y*r1y-rn1*rn1)+b2.iI*(r2x*r2x+r2y*r2y-rn2*rn2));
    c.mt=1/(b1.im+b2.im+b1.iI*(r1x*r1x+r1y*r1y-rt1*rt1)+b2.iI*(r2x*r2x+r2y*r2y-rt2*rt2));
    c.bias=-BIAS*invDt*Math.min(0,c.sep+SLOP);
    // A pearl bounces a little off what it hits.
    const vn=(b2.vx-b2.w*r2y-b1.vx+b1.w*r1y)*nx+(b2.vy+b2.w*r2x-b1.vy-b1.w*r1x)*ny;
    c.vb=a.e&&vn<-60?-a.e*vn:0;
    const px=c.Pn*nx+c.Pt*tx, py=c.Pn*ny+c.Pt*ty;
    b1.vx-=b1.im*px;b1.vy-=b1.im*py;b1.w-=b1.iI*(r1x*py-r1y*px);
    b2.vx+=b2.im*px;b2.vy+=b2.im*py;b2.w+=b2.iI*(r2x*py-r2y*px);
  }
}
function applyImpulse(a){
  const b1=a.b1, b2=a.b2;
  for(const c of a.c){
    const nx=c.nx, ny=c.ny, tx=ny, ty=-nx;
    let dvx=b2.vx-b2.w*c.r2y-b1.vx+b1.w*c.r1y, dvy=b2.vy+b2.w*c.r2x-b1.vy-b1.w*c.r1x;
    let dPn=c.mn*(-(dvx*nx+dvy*ny)+Math.max(c.bias,c.vb));
    const pn0=c.Pn;c.Pn=Math.max(pn0+dPn,0);dPn=c.Pn-pn0;
    let px=dPn*nx, py=dPn*ny;
    b1.vx-=b1.im*px;b1.vy-=b1.im*py;b1.w-=b1.iI*(c.r1x*py-c.r1y*px);
    b2.vx+=b2.im*px;b2.vy+=b2.im*py;b2.w+=b2.iI*(c.r2x*py-c.r2y*px);
    dvx=b2.vx-b2.w*c.r2y-b1.vx+b1.w*c.r1y;dvy=b2.vy+b2.w*c.r2x-b1.vy-b1.w*c.r1x;
    let dPt=c.mt*-(dvx*tx+dvy*ty);
    const max=a.f*c.Pn, pt0=c.Pt;c.Pt=clampN(pt0+dPt,-max,max);dPt=c.Pt-pt0;
    px=dPt*tx;py=dPt*ty;
    b1.vx-=b1.im*px;b1.vy-=b1.im*py;b1.w-=b1.iI*(c.r1x*py-c.r1y*px);
    b2.vx+=b2.im*px;b2.vy+=b2.im*py;b2.w+=b2.iI*(c.r2x*py-c.r2y*px);
  }
}
function stepBodies(w,h,events){
  const B=w.bodies, n=B.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    let b1=B[i], b2=B[j];
    if(!b1.im&&!b2.im)continue;
    if(b1.r&&b2.r)continue;
    if(Math.abs(b1.x-b2.x)>b1.bound+b2.bound||Math.abs(b1.y-b2.y)>b1.bound+b2.bound)continue;
    if(b1.r){const t=b1;b1=b2;b2=t;}
    const out=[];
    if(b2.r)collideCircle(b1,b2,out);else collideBoxes(b1,b2,out);
    const key=b1.id*4096+b2.id, old=w.arbs.get(key);
    if(!out.length){if(old)w.arbs.delete(key);continue;}
    if(old){
      for(const c of out){const o=old.c.find(q=>q.key===c.key);if(o){c.Pn=o.Pn;c.Pt=o.Pt;}}
      old.c=out;
    } else {
      w.arbs.set(key,{b1,b2,c:out,f:Math.sqrt(b1.f*b2.f),e:b2.r?PEARL_BOUNCE:0});
      const vn=-((b2.vx-b1.vx)*out[0].nx+(b2.vy-b1.vy)*out[0].ny);
      if(vn>50)events.push({type:'hit',a:b1.kind,b:b2.kind,v:vn,x:out[0].x,y:out[0].y});
    }
  }
  for(const b of B)if(b.im)b.vy+=h*GRAV;
  const invDt=1/h;
  for(const a of w.arbs.values())preStep(a,invDt);
  for(let k=0;k<ITER;k++)for(const a of w.arbs.values())applyImpulse(a);
  for(const b of B)if(b.im){b.x+=h*b.vx;b.y+=h*b.vy;b.a+=h*b.w;}
}

function spawnSet(w,index){
  // Cups that already left their shelf but still rest somewhere are cleared away with the old set.
  for(const b of w.bodies.slice())if(b.kind==='cup')removeBody(w,b);
  w.set=index;w.setCups=[];w.nextSetAt=0;
  SETS[index].forEach((p,k)=>{
    const shelf=SHELVES[p.shelf], pyr={id:w.pyrs.length,set:index,size:p.rows*(p.rows+1)/2,shots:new Set(),left:0};
    w.pyrs.push(pyr);
    for(let r=0;r<p.rows;r++)for(let i=0;i<p.rows-r;i++){
      const x=p.x+(i-(p.rows-r-1)/2)*(CUP_W+2), y=shelf.y-CUP_H/2-r*CUP_H;
      const cup=addBody(w,boxBody('cup',x,y,CUP_W/2,CUP_H/2,CUP_M,CUP_FRICTION));
      Object.assign(cup,{shelf:p.shelf,pyr,dropped:false,tint:(w.cupTint++)%4,born:w.t});
      pyr.left++;w.setCups.push(cup);
    }
  });
}
function createWorld(){
  const w={t:0,bodies:[],arbs:new Map(),nextId:1,pyrs:[],cupTint:0,set:-1,setCups:[],nextSetAt:0,
    ammo:PEARLS,phase:'ready',armed:true,hold:0,aim:AIM_START,coughT:0,coughs:0,shots:[],cups:0,clears:[],
    oneShot:false,allClear:false,over:false,quiet:0,pearl:null};
  for(const s of SHELVES)addBody(w,boxBody('shelf',(s.x0+s.x1)/2,s.y+SHELF_T/2,(s.x1-s.x0)/2,SHELF_T/2,0,.8));
  spawnSet(w,0);
  // Let the first pyramid settle its contacts before the round.
  for(let i=0;i<30;i++)stepBodies(w,1/120,[]);
  w.t=0;
  return w;
}
// One frame. input: {down (finger, mouse button or space held), daim (aim change in radians this frame)}.
// Returns events for sound and reactions: charge, shot, gulp, hit, drop, clear, spawn, over.
function stepWorld(w,input,dt){
  const ev=[];w.t+=dt;
  if(!w.over){
    w.aim=clampN(w.aim+(input.daim||0),AIM_MIN,AIM_MAX);
    // Each pearl needs a fresh press: a finger still down after a shot or a cough does nothing until it lifts.
    if(!input.down&&w.phase!=='charge')w.armed=true;
    if(w.phase==='cough'){w.coughT-=dt;if(w.coughT<=0)w.phase='ready';}
    else if(w.phase==='charge'){
      if(!input.down)shoot(w,ev);
      else{
        w.hold+=dt;
        if(w.hold>=CHARGE_S+GRACE_S){w.phase='cough';w.coughT=COUGH_S;w.coughs++;w.armed=false;ev.push({type:'gulp',last:w.ammo===0});}
      }
    } else if(input.down&&w.armed&&w.ammo>0&&!w.allClear){w.phase='charge';w.hold=0;w.ammo--;w.armed=false;ev.push({type:'charge'});}
  }
  const h=dt/SUBSTEPS;
  for(let s=0;s<SUBSTEPS;s++)stepBodies(w,h,ev);
  // Bookkeeping: cups that left their shelf, bodies that left the stall, cleared sets.
  let moving=false;
  for(const b of w.bodies.slice()){
    if(b.kind==='shelf')continue;
    if(b.kind==='cup'){
      if(!b.dropped&&(b.y>SHELVES[b.shelf].y+2||b.x>SHELVES[b.shelf].x1+CUP_H||b.x<SHELVES[b.shelf].x0-CUP_H))dropCup(w,b,ev);
      if(b.y>720||b.x>470||b.x<-80){removeBody(w,b);continue;}
      if(Math.abs(b.vx)+Math.abs(b.vy)>40)moving=true;
    } else if(b.kind==='pearl'){
      b.age+=dt;
      const slow=Math.abs(b.vx)+Math.abs(b.vy)<25;b.rest=slow?b.rest+dt:0;
      if(b.y>720||b.x>470||b.x<-80||b.age>5||b.rest>.5){removeBody(w,b);if(w.pearl===b)w.pearl=null;continue;}
      moving=true;
    }
  }
  if(w.set>=0&&w.setCups.length&&!w.nextSetAt&&!w.allClear&&w.setCups.every(c=>c.dropped)){
    w.clears.push({set:w.set,t:w.t,shot:w.shots.length-1});
    ev.push({type:'clear',set:w.set,pts:CLEAR_PTS[w.set],final:w.set===SETS.length-1});
    if(w.set===SETS.length-1){w.allClear=true;if(w.phase==='charge'){w.phase='ready';w.ammo++;}}
    else w.nextSetAt=w.t+SET_DELAY;
  }
  if(w.nextSetAt&&w.t>=w.nextSetAt){spawnSet(w,w.set+1);ev.push({type:'spawn',set:w.set});}
  // The game ends once the last pearl is used (or every set is cleared) and the stall has gone quiet.
  const done=(w.ammo===0||w.allClear)&&w.phase!=='charge'&&w.phase!=='cough'&&!w.nextSetAt;
  w.quiet=done&&!moving?w.quiet+dt:0;
  if(!w.over&&done&&(w.quiet>=.8||w.t-(w.shots.at(-1)?.t??0)>5)){w.over=true;ev.push({type:'over'});}
  return ev;
}
function shoot(w,ev){
  const p=powerOf(w.hold), v=speedOf(p), m=muzzle(w.aim);
  const pearl=addBody(w,circleBody('pearl',m.x,m.y,PEARL_R,PEARL_M,PEARL_FRICTION));
  Object.assign(pearl,{vx:Math.cos(w.aim)*v,vy:-Math.sin(w.aim)*v,age:0,rest:0});
  w.pearl=pearl;w.phase='ready';
  w.shots.push({t:w.t,p,aim:w.aim,cups:0});
  ev.push({type:'shot',p,last:w.ammo===0});
}
function dropCup(w,cup,ev){
  cup.dropped=true;w.cups++;
  const shot=w.shots.length-1;
  if(shot>=0)w.shots[shot].cups++;
  cup.pyr.left--;cup.pyr.shots.add(shot);
  // One shot clearing a whole pyramid of six or more.
  if(!cup.pyr.left&&cup.pyr.size>=6&&cup.pyr.shots.size===1)w.oneShot=true;
  ev.push({type:'drop',x:cup.x,y:cup.y,shot});
}
function scoreOf(w){
  let s=w.cups*CUP_PTS;
  for(const c of w.clears)s+=CLEAR_PTS[c.set];
  if(w.allClear)s+=w.ammo*LEFT_PTS;
  return s;
}
// Ranks: 特賞 by score, then how you played, then the other prize ranks by score. First match wins.
// gulp: every pearl swallowed, none shot. perfect: no cough and every pearl shot dropped a cup.
// oneshot: one shot cleared a whole pyramid of six or more. cough: COUGH_RANK swallowed pearls or more.
const COUGH_RANK=5, SCORE_RANKS=[['tokusho',4000],['first',2700],['second',1800],['third',900]];
function chooseRankId(w){
  const s=scoreOf(w);
  if(!w.shots.length)return 'gulp';
  if(s>=SCORE_RANKS[0][1])return 'tokusho';
  if(!w.coughs&&(w.shots.length===PEARLS||w.allClear)&&w.shots.every(x=>x.cups>0))return 'perfect';
  if(w.oneShot)return 'oneshot';
  if(w.coughs>=COUGH_RANK)return 'cough';
  if(!w.cups)return 'zero';
  for(const [id,min] of SCORE_RANKS)if(s>=min)return id;
  return 'sanka';
}

// After the pearl is gone and a short wait for cups still falling: a cheer, a big cheer or a miss.
function judgeShot(now) {
  if(!judge)return;
  if(world.pearl&&world.shots.length-1===judge.shot){judge.at=0;return;}
  if(!judge.at){judge.at=now;return;}
  if(now-judge.at<450)return;
  const n=world.shots[judge.shot].cups;judge=null;
  if(n>=3){setMood('amazed',1200);setAvMood('proud',1300);react(BIG_LINES);}
  else if(n>0)react(HIT_LINES,.6);
  else{setMood('worried',1000);setAvMood('grimace',1100);react(MISS_LINES,.6);}
}
function playTick(now) {
  const input={down:finger.down||keyDown,daim:finger.daim+((keyUp?1:0)-(keyDn?1:0))*KEY_AIM*dtFrame};finger.daim=0;
  const events=stepWorld(world,input,dtFrame);
  onEvents(events,now);
  updateSlurp(world.phase==='charge'?Math.min(1,world.hold/CHARGE_S):null);
  if(world.pearl)trail.push([world.pearl.x,world.pearl.y]);if(trail.length>6)trail.shift();
  judgeShot(now);
  if(!saidLast&&world.ammo===1&&world.phase==='ready'&&!world.pearl&&!world.allClear&&!judge){saidLast=true;react(LAST_LINES,1,true);}
  if(moodUntil&&now>=moodUntil)setMood(world.phase==='charge'&&world.hold>CHARGE_S?'worried':'watch');
  if(world.phase==='charge'&&world.hold>CHARGE_S&&mood==='watch')setMood('worried');
}
async function finish(forced) {
  if(state!=='play')return;
  // A new generation drops any reaction still queued from play.
  const g=++generation;state='end';endAt=performance.now();finger.down=keyDown=false;finger.id=null;updateSlurp(null);
  rank=forced||rankById(chooseRankId(world));
  show('hud',false);
  if(!forced){$('count').textContent=L('おしまい！','끝!');$('count').classList.add('small');show('count',true);play('k_bong_001',.6,.8);ownerUntil=0;sayOwner(L('おしまい！','끝!'),'end',{shout:true});}
  setMood('talk');
  await wait(forced?300:END_TO_REVEAL_MS);if(g!==generation)return;
  show('count',false);
  state='reveal';setMood(rank.mood);setAvMood(AV_RESULT[rank.id]||'idle');
  const prize=['tokusho','perfect','oneshot','first'].includes(rank.id);
  play(prize?'k_confirmation_001':'k_bong_001',prize?.8:.4,prize?1:.7);
  ownerUntil=0;sayOwner(rank.name+L('！','!'),'rank_'+rank.id,{shout:true});
  if(prize&&!REDUCED)for(let i=0;i<40;i++)confetti.push({x:rand(150,390),y:rand(250,400),vx:rand(-60,60),vy:rand(-140,-20),r:rand(3,6),life:rand(1,1.8),color:['#e8383d','#ffc83a','#fff','#7fd8ff'][i%4]});
  sayOwnerQueued(rank.line,'say_'+rank.id,g);
  await wait(600);if(g!==generation)return;
  state='done';
  const n=world.cups, score=scoreOf(world);
  $('rank-name').textContent=rank.name;$('verdict').textContent=rank.verdict;$('hint').textContent=rank.hint;
  const newBest=!CARD_MODE&&score>0&&(best===null||score>best);
  if(newBest){best=score;try{localStorage.setItem('shooter.bestScore',String(best));}catch(_){}}
  const parts=[L(`カップ ${n}個`,`컵 ${n}개`)];if(best)parts.push((newBest?L('新記録！ ','신기록! '):'')+L(`自己ベスト ${fmt(best)}点`,`최고 기록 ${fmt(best)}점`));
  $('best').textContent=parts.join(' · ');
  countUp(score,g);
  shareText=KO?(rank.id==='gulp'
    ? `${OWNER_NAME}: "${rank.line}"\n타피오카 10알, 전부 삼켜 버렸다 [${rank.name}]\n여러분은 몇 개 떨어뜨려요? ${HASHTAG}`
    : `${OWNER_NAME}: "${rank.line}"\n타피오카 10알로 컵 ${n}개, ${fmt(score)}점 [${rank.name}]\n여러분은 몇 점? ${HASHTAG}`):rank.id==='gulp'
    ? `${OWNER_NAME}「${rank.line}」\nタピオカ10粒、ぜんぶ飲んじゃった【${rank.name}】\nあなたは何個落とせる？ ${HASHTAG}`
    : `${OWNER_NAME}「${rank.line}」\nタピオカ10粒でカップ${n}個、${fmt(score)}点【${rank.name}】\nあなたは何点？ ${HASHTAG}`;
  $('share').href='https://x.com/intent/post?text='+encodeURIComponent(shareText)+'&url='+encodeURIComponent(URL_PUBLIC+'card/'+(KO?'ko/':'')+rank.id+'.html');
  if(CARD_MODE){resize();({scale,ox,oy}=targets.result);showPicture(await drawShareImage({rank}));return;}
  show('result',true);
  prepareShare({rank,cups:n,score},g);
}
function countUp(n,g) {
  const el=$('points-n'), t0=performance.now(), ms=REDUCED||n<3?0:900;
  const tick=now=>{if(g!==generation)return;const k=ms?Math.min(1,(now-t0)/ms):1;el.textContent=fmt(Math.round(n*(1-(1-k)**3)));if(k<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

/* ---------- input ---------- */
// One gesture for a finger and a mouse: press anywhere to slurp (charge), slide up or down while holding to turn
// the straw, release to shoot. Where the press lands does nothing, so a tap is never both the aim and the shot.
// Space charges and the up and down arrows aim.
const aiming=()=>['intro','count','play'].includes(state);
cv.addEventListener('pointerdown',e=>{
  if(!aiming())return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();initAudio();
  if(finger.id!==null)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  Object.assign(finger,{id:e.pointerId,down:true,lastY:e.clientY});
});
// Android's long press would open a menu and cancel the touch.
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==finger.id)return;
  if(aiming())finger.daim+=(finger.lastY-e.clientY)/scale*AIM_GAIN;
  finger.lastY=e.clientY;
});
const lift=e=>{if(e.pointerId===finger.id){finger.down=false;finger.id=null;}};
for(const type of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(type,lift);
addEventListener('keydown',e=>{
  if(!aiming())return;
  if(e.code==='Space'||e.key===' '){e.preventDefault();initAudio();keyDown=true;}
  else if(e.key==='ArrowUp'){e.preventDefault();keyUp=true;}
  else if(e.key==='ArrowDown'){e.preventDefault();keyDn=true;}
});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key===' ')keyDown=false;else if(e.key==='ArrowUp')keyUp=false;else if(e.key==='ArrowDown')keyDn=false;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){finger.down=keyDown=keyUp=keyDn=false;finger.id=null;updateSlurp(null);ac?.suspend().catch(()=>{});}
  else if(ac)ac.resume().catch(()=>{});
  show('paused',document.hidden&&state==='play');
});

const INK='#1d1533', SKIN='#f6c9a0', SKIN_DARK='#e0a77c', HAIR='#22182c', WHITE='#fff8e8', RED='#e8383d', GOLD='#ffc83a', INDIGO='#2f3f8f', TEAR='#7fd8ff';
const WOOD='#e8b36c', WOOD_DARK='#b97a3e', CLOTH='#c9303a', CLOTH_DARK='#a8242f', TEA='#d9b38a', PEARL_C='#3a2219';
const CUP_TINTS=['#ffb3c7','#bdf0c8','#d6c4ff','#fff0a0'];
function ellipse(c,x,y,rx,ry,fill,stroke=true) { c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(stroke)c.stroke(); }
function poly(c,points,fill) { c.beginPath();c.moveTo(...points[0]);for(const p of points.slice(1))c.lineTo(...p);c.closePath();if(fill){c.fillStyle=fill;c.fill();}c.stroke(); }
function line(c,pts,width,color=INK) { c.beginPath();c.moveTo(pts[0],pts[1]);if(pts.length===6)c.quadraticCurveTo(pts[2],pts[3],pts[4],pts[5]);else c.lineTo(pts[2],pts[3]);c.lineWidth=width;c.strokeStyle=color;c.stroke(); }
function star(c,x,y,r,fill) { c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4, rr=i%2?r*.36:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=INK;c.stroke(); }
// Face presets, drawn in a 0,190-centred head. brow > 0 lifts the inner ends (worry), < 0 lowers them (anger).
const FACES={
  watch:{brow:-.15,eye:'dot',mouth:'smile'},
  talk:{brow:-.1,eye:'dot',mouth:'open'},
  happy:{brow:0,eye:'happy',mouth:'grin'},
  laugh:{brow:.1,eye:'happy',mouth:'laugh'},
  amazed:{brow:.4,eye:'star',mouth:'O',sparkle:1},
  shock:{brow:.55,eye:'wide',mouth:'O',sweat:1},
  worried:{brow:.55,eye:'dot',mouth:'wobble',sweat:1},
  sad:{brow:.6,eye:'dot',mouth:'frown',tears:'drop'},
};
function drawEye(c,x,kind,t,side) {
  c.strokeStyle=INK;c.lineWidth=4;
  if(kind==='dot'){ellipse(c,x,190,6,8,INK,false);ellipse(c,x-2,186,2,2.5,'#fff',false);}
  else if(kind==='happy')line(c,[x-10,194,x,180,x+10,194],5);
  else if(kind==='wide'){ellipse(c,x,188,11,12,'#fff');ellipse(c,x,189,4,4,INK,false);}

function drawFace(c,m,t) {
  const f=FACES[m]||FACES.watch;
  c.lineCap='round';
  // Thick festival brows.
  for(const s of [-1,1]){const b=f.brow;line(c,[s*7,170-b*10,s*20,163-Math.abs(b)*2,s*34,168+b*6],8,HAIR);}
  for(const s of [-1,1])drawEye(c,s*20,f.eye,t,s);
  c.save();c.globalAlpha=.45;for(const s of [-1,1])ellipse(c,s*34,210,9,5.5,'#ff8f8f',false);c.restore();
  c.strokeStyle=INK;c.lineWidth=4;
  const mo=f.mouth, mf='#a8323f';
  if(mo==='smile')line(c,[-12,214,0,224,12,214],4.5);
  else if(mo==='grin'){c.beginPath();c.moveTo(-16,212);c.quadraticCurveTo(0,238,16,212);c.closePath();c.fillStyle=mf;c.fill();c.stroke();}
  else if(mo==='laugh'){c.beginPath();c.moveTo(-18,210);c.quadraticCurveTo(0,246,18,210);c.closePath();c.fillStyle=mf;c.fill();c.stroke();ellipse(c,0,228,8,5,'#ff8f8f',false);}
  else if(mo==='open')ellipse(c,0,220,8,5+Math.abs(Math.sin(t*.018))*4,mf);
  else if(mo==='O')ellipse(c,0,222,9,12,mf);
  else if(mo==='frown')line(c,[-12,224,0,213,12,224],4.5);
  else if(mo==='wobble'){c.beginPath();c.moveTo(-12,219);for(let i=1;i<=6;i++)c.lineTo(-12+i*4,219+(i%2?-3:2));c.stroke();}
  c.lineWidth=3;c.strokeStyle=INK;
  if(f.tears==='drop')for(const s of [-1,1]){const k=(t*.0012+(s>0?.5:0))%1;c.beginPath();c.ellipse(s*21,200+k*28,4,6,0,0,7);c.fillStyle=TEAR;c.fill();}
  if(f.sweat){const y=150+((t*.03)%6);c.beginPath();c.moveTo(50,y-9);c.quadraticCurveTo(57,y+3,50,y+5);c.quadraticCurveTo(43,y+3,50,y-9);c.fillStyle=TEAR;c.fill();c.lineWidth=2.5;c.stroke();}
  if(f.sparkle)for(let i=0;i<3;i++){const a=t*.002+i*2.1;star(c,Math.cos(a)*74,176+Math.sin(a)*58,7+Math.sin(t*.01+i)*2,GOLD);}

// A cup: a clear tapered cup with a sealed top, drawn inside its box (24 by 32).
function drawCup(c,b,now) {

  if(!document.hidden&&!CARD_THUMB){
    if(state==='play')playTick(now);
    else if(state==='count'||state==='intro'){world.aim=clamp(world.aim+finger.daim+((keyUp?1:0)-(keyDn?1:0))*KEY_AIM*dt,AIM_MIN,AIM_MAX);finger.daim=0;}
    else if(state==='end'||state==='reveal'||state==='done'){stepWorld(world,{down:false,daim:0},dt);updateSlurp(null);}
    if(bubbleHideAt&&now>=bubbleHideAt){$('bubble').style.visibility='hidden';bubbleHideAt=0;}
    if(state!=='play'&&moodUntil&&now>=moodUntil)setMood('watch');
  }
  if(!document.hidden||CARD_MODE)draw(now,dt);
  requestAnimationFrame(frame);
}

/* ---------- share picture ---------- */
// The framed picture is the live scene redrawn at card size, including his actual reaction.
async function drawShareImage({rank:e,card,cups:n,score}) {
  await document.fonts?.load(`60px ${DISPLAY_FONT}`,L('タピオカ射的10粒で、カップを何個落とせる？ストロー1本「」0123456789,個点あなたはぽん吉段目全','타피오카 사격 10알로, 컵을 몇 개 떨어뜨릴래? 꾹 눌러 빨고, 떼서 발사! 너무 빨면, 꿀꺽. “”0123456789,개점여러분은 폰키치 단째 총 사격')+RANKS.map(x=>x.name+x.line).join(''));
  const c=document.createElement('canvas');c.width=1200;c.height=675;
  const x=c.getContext('2d');
  x.fillStyle='#1b1d4a';x.fillRect(0,0,1200,675);
  // Text sits on a cream panel styled like the in-game HUD (ink border, hard drop shadow).
  x.beginPath();x.roundRect(488,42,686,599,28);x.fillStyle=INK;x.fill();
  x.beginPath();x.roundRect(486,34,686,599,28);x.fillStyle=WHITE;x.fill();x.lineWidth=6;x.strokeStyle='#000';x.stroke();
  const FX=26, FY=42, FW=430, FH=591, y0=150, y1=676, k=FH/(y1-y0), cx=205;
  x.save();x.beginPath();x.rect(FX,FY,FW,FH);x.clip();
  x.setTransform(k,0,0,k,FX+FW/2-cx*k,FY-y0*k);drawScene(x,performance.now());x.restore();
  x.lineWidth=8;x.strokeStyle='#000';x.strokeRect(FX,FY,FW,FH);
  const CX=829, MAXW=620;
  // Dense kanji stay readable with a thin outline: dark text gets a thin white halo, red text a thin dark edge
  // plus a drop shadow, never a thick stroke that fills the gaps inside the glyphs.
  const fitFont=(str,size,maxW)=>{x.font=`${size}px ${DISPLAY_FONT}`;const tw=x.measureText(str).width;if(tw>maxW){size*=maxW/tw;x.font=`${size}px ${DISPLAY_FONT}`;}return size;};
  const text=(str,tx,ty,size,fill,maxW=MAXW,align='center')=>{
    x.textAlign=align;x.textBaseline='middle';x.lineJoin='round';size=fitFont(str,size,maxW);
    if(fill===INK){x.lineWidth=Math.max(3,size*.1);x.strokeStyle='#fff';x.strokeText(str,tx,ty);}
    else{x.fillStyle=INK;x.fillText(str,tx,ty+size*.06);x.lineWidth=Math.max(2.5,size*.05);x.strokeStyle=INK;x.strokeText(str,tx,ty);}
    x.fillStyle=fill;x.fillText(str,tx,ty);
    return x.measureText(str).width;
  };
  const stamp=(str,tx,ty,size)=>{
    x.save();x.translate(tx,ty);x.rotate(-.06);x.font=`${size}px ${DISPLAY_FONT}`;x.textAlign='center';x.textBaseline='middle';
    const tw=x.measureText(str).width+size*.9, th=size*1.35;
    x.beginPath();x.roundRect(-tw/2,-th/2,tw,th,size*.25);x.fillStyle='#fff';x.fill();x.lineWidth=9;x.strokeStyle=RED;x.stroke();
    x.fillStyle=RED;x.fillText(str,0,size*.04);x.restore();
  };
  // Title: タピオカ in dark, 射的 in red, as on the page.
  x.font=`66px ${DISPLAY_FONT}`;const T1=L('タピオカ','타피오카 '), T2=L('射的','사격'), w1=x.measureText(T1).width, w2=x.measureText(T2).width, left=CX-(w1+w2)/2;
  text(T1,left,100,66,INK,MAXW,'left');text(T2,left+w1,100,66,RED,MAXW,'left');
  if(card===null){
    text(L('タピオカ10粒で、','타피오카 10알로,'),CX,238,80,RED);text(L('何個落とせる？','몇 개 떨어뜨릴래?'),CX,346,92,RED);
    text(L('長押しで吸って、離して発射！','꾹 눌러 빨고, 떼서 발사!'),CX,480,40,INK);
    text(L('吸いすぎると、ゴクッ。','너무 빨면, 꿀꺽.'),CX,548,40,INK);
  } else {
    // A real game stamps the player's own score and cups under the rank; the static ?card pages have none.
    if(n===undefined){
      text(e.name,CX,250,e.name.length>4?96:120,RED);
    } else {
      text(e.name,CX,200,e.name.length>4?84:100,RED);
      stamp(L(`${fmt(score)}点`,`${fmt(score)}점`),CX,326,60);
      text(L(`タピオカ10粒で、カップ ${n}個`,`타피오카 10알로 컵 ${n}개`),CX,398,32,INK);
    }
    const quote=KO?OWNER_NAME+': “'+e.line+'”':OWNER_NAME+'「'+e.line+'」', chars=Array.from(quote), qy=n===undefined?412:476;
    x.font=`36px ${DISPLAY_FONT}`;
    if(x.measureText(quote).width>MAXW){let mid=Math.ceil(chars.length/2);{let best=-1;chars.forEach((ch,i)=>{if('、。！？…」'.includes(ch)&&i+1<chars.length&&!'、。！？…」'.includes(chars[i+1])&&Math.abs(i+1-chars.length/2)<chars.length/4&&(best<0||Math.abs(i+1-chars.length/2)<Math.abs(best-chars.length/2)))best=i+1;});if(best>0)mid=best;}
      // Korean wraps at the space nearest the middle, never inside a word.
      if(KO){const sp=chars.map((ch,i)=>ch===' '?i:-1).filter(i=>i>0);if(sp.length)mid=sp.reduce((a,b)=>Math.abs(b-chars.length/2)<Math.abs(a-chars.length/2)?b:a)+1;}text(chars.slice(0,mid).join(''),CX,qy-14,34,INK);text(chars.slice(mid).join(''),CX,qy+30,34,INK);}
    else text(quote,CX,qy,36,INK);
    text(e.id==='gulp'?L('あなたは何個落とせる？','여러분은 몇 개 떨어뜨릴래요?'):L('あなたは何点とれる？','여러분은 몇 점 낼래요?'),CX,580,42,INK);
  }
  return new Promise(res=>c.toBlob(res,'image/png'));
}
let shareFile=null, shareText='';
async function prepareShare(shot,g) {
  try {
    const blob=await drawShareImage(shot);
    if(g!==generation||!blob)return;
    shareFile=new File([blob],'tapioca-shateki.png',{type:'image/png'});
    // Phones that can share files: the picture is the main way to post, so its button leads.
    const sheet=canShareFile();
    $('save').textContent=sheet?L('画像でシェア','이미지로 공유'):L('画像を保存','이미지 저장');
    $('save').className=sheet?'':'alt';
    $('save').style.display=TOUCH?'inline-flex':'none';
  } catch(err) { console.warn('share image',err); }
}
const canShareFile=()=>!!(TOUCH&&shareFile&&navigator.canShare&&navigator.share&&navigator.canShare({files:[shareFile]}));
function download() {
  const a=document.createElement('a'), url=URL.createObjectURL(shareFile);
  a.href=url;a.download=shareFile.name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function note(text) { const el=$('tip');el.textContent=text;el.style.display='block'; }
// On PC the picture goes to the clipboard first (⌘V / Ctrl+V into the post), falling back to a download;
// X opens after the copy, while the page still has focus.
if(!TOUCH)$('share').innerHTML=L('Xでポスト<small>画像もコピー</small>','X에 올리기<small>이미지도 복사</small>');
$('share').addEventListener('click',async e=>{
  if(TOUCH||!shareFile)return;
  e.preventDefault();
  const href=$('share').href, paste=/Mac/.test(navigator.platform)?'⌘V':'Ctrl+V';
  try {
    await navigator.clipboard.write([new ClipboardItem({'image/png':shareFile})]);
    note(L(`リンクに結果カードが付きます。射的の画像も付けるなら ${paste}`,`링크에 결과 카드가 붙어요. 사격 이미지도 넣으려면 ${paste}`));
  } catch(err) { console.warn('clipboard',err);download();note(L('画像を保存しました。投稿に添付してください','이미지를 저장했어요. 게시물에 첨부해 주세요')); }
  window.open(href,'_blank','noopener');
});
$('save').addEventListener('click',e=>{
  e.currentTarget.blur();
  if(!shareFile)return;
  if(!canShareFile())return download();
  navigator.share({files:[shareFile],text:shareText,url:URL_PUBLIC+(KO?'?hl=ko':'')}).catch(err=>{
    if(err.name!=='AbortError'){console.warn('share',err);download();}   // AbortError: the sheet was closed
  });
});
function showPicture(blob) {
  const i=new Image();i.id='preview';i.src=URL.createObjectURL(blob);
  i.style.cssText='position:fixed;left:0;top:0;width:1200px;height:675px;z-index:99';document.body.append(i);
}

/* ---------- boot ---------- */
const query=new URLSearchParams(location.search), CARD_MODE=query.has('card');
// ?card (no id) freezes a moment of play for the thumbnail: a pearl on its way to a full pyramid.
const CARD_THUMB=CARD_MODE&&!query.get('card')?1:0;
resize();placeBubble();
requestAnimationFrame(frame);
if(CARD_MODE) {
  show('home',false);show('title',false);$('bubble').style.visibility='hidden';
  if(CARD_THUMB){
    world=createWorld();state='play';world.aim=34*DEG;world.ammo=7;world.cups=0;
    const m=muzzle(world.aim), pearl=circleBody('pearl',m.x+98,m.y-52,PEARL_R,PEARL_M,PEARL_FRICTION);
    world.bodies.push(pearl);world.pearl=pearl;for(let i=1;i<=6;i++)trail.push([m.x+98-i*15,m.y-52+i*7.5]);
    setMood('amazed');fx.push({text:L('プッ！','퓻!'),x:m.x+44,y:m.y-46,born:performance.now(),life:1e9,color:'#fff',size:26});
    resize();setTimeout(()=>drawShareImage({card:null}).then(showPicture),300);
  } else {
    const forced=rankById(query.get('card'))||rankById('tokusho'), s=CARD_STATE[forced.id];
    world=createWorld();
    if(s.set)spawnSet(world,s.set);
    const cups=world.bodies.filter(b=>b.kind==='cup').sort((a,b)=>a.y-b.y);
    for(const b of cups.slice(0,s.gone))removeBody(world,b);
    world.ammo=0;
    if(forced.id==='cough'){av.cough=1;fx.push({text:L('ゲホッ','콜록'),x:NECK.x+92,y:NECK.y-132,born:performance.now(),life:1e9,color:'#fff',size:30,font:ROUND_FONT});}
    state='play';finish(forced);
  }
}
