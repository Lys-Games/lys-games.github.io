<body>
<canvas id="cv"></canvas>

<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), ui = $('ui');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- tuning ---------- */
const RANKS = [ // [under this many seconds, rank, verdict, his line]
  [0.02, '神の手', '痛みを感じるヒマもなかった', 'え？もう、終わった？'],
  [0.05, 'プロの手つき', 'ほぼ無痛。お見事！', 'ちょっと、チクっとしただけ'],
  [0.15, 'ふつう', 'ほとんど痛くなかった', '…あれ？意外と平気'],
  [0.4, 'ためらい派', '迷った分だけ、彼は苦しんだ', 'いってぇ…迷わないでよ…'],
  [1, 'じわじわ派', 'じわじわが、いちばんつらい', '毛根ごと、持っていかれた…'],
  [3, '拷問官', '長く、深く、苦しませた', 'わざとだよね？'],
  [Infinity, '悪魔', '人の心はないのか', 'もう…お婿に行けない…'],
];
const SCREAMS = [[0.4, 'v_ow1', 'いてっ！'], [1.2, 'v_ow2', 'いたたたたたっ！'], [2.6, 'v_ow3', '痛い痛い痛い痛いっ！'],
  [4.6, 'v_ow4', 'ぎゃあああああっ！'], [7, 'v_ow5', 'おかあさあああんっ！'], [9.4, 'v_ow4', 'ぎゃあああああっ！'],
  [11.4, 'v_ow3', '痛い痛い痛い痛いっ！'], [13.2, 'v_ow5', 'おかあさあああんっ！']];
const FAINT_AT = 15;          // seconds of peeling before he passes out
const GAIN = 1.25;            // bandage peeled per unit of finger travel
const TAU = 200;              // ms, how long a released flick keeps ripping
const painOf = s => 1 - Math.exp(-s / 1.3);
// times show rounded down to the hundredth, so the shown time, the rank and the link card always agree
const fmt = s => (Math.floor(s * 100 + 1e-6) / 100).toFixed(2);
// link cards: every 0.01 s under 0.2 s, every 0.1 s up to 1 s, every second up to 10 s, then one card.
// No card spans a rank boundary (RANKS), so the card's rank is the player's.
const cardOf = s => s >= 10 ? 'max' : s >= 1 ? 's' + Math.floor(s + 1e-6) : s >= .2 ? 'd' + Math.floor(s * 10 + 1e-6) : 'c' + Math.floor(s * 100 + 1e-6);
const rankOf = s => RANKS.findIndex(q => s < q[0]);
const URL_PUBLIC = 'https://lys-games.github.io/mini-games/bandage/';
const QUOTE_POST = '';   // the game's launch post on X: result posts quote it once set
const TOUCH = matchMedia('(pointer: coarse)').matches;
const FONT = '"Dela Gothic One","Hiragino Sans",system-ui,sans-serif';

/* ---------- stage ---------- */
const U = 400, X0 = 62, BL = 280, BH = 60;
let W, H, dpr, sc, SH, ox, headY, armY;
function resize() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  sc = Math.min(W / U, H / 780); SH = H / sc; ox = (W - U * sc) / 2;
  const ex = SH - 780;
  headY = 240 + ex * 0.3; armY = 502 + ex * 0.5;
  ui.style.left = ox + 'px'; ui.style.width = U * sc + 'px';
  document.documentElement.style.setProperty('--u', sc + 'px');
  $('bubble').style.top = (headY + 100) * sc + 'px';
  $('telop').style.top = $('hint').style.top = (armY + 122) * sc + 'px';
}
addEventListener('resize', resize); resize();

/* ---------- audio ---------- */
const FILES = ['k_select_003', 'k_bong_001', 'k_confirmation_001', 'k_impactSoft_heavy_000', 'k_impactPunch_heavy_000', 'k_maximize_003',
  'v_title', 'v_c3', 'v_c2', 'v_go', 'v_matte', 'v_gentle', 'v_ow1', 'v_ow2', 'v_ow3', 'v_ow4', 'v_ow5',
  ...[0, 1, 2, 3, 4, 5, 6].flatMap(i => ['v_r' + i, 'v_say' + i])];
const raw = {}, sfx = {};
for (const n of FILES) raw[n] = fetch('sfx/' + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
let ac, master, noise, decoded;
function initAudio() {
  if (ac) { ac.resume(); return decoded; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  decoded = Promise.all(FILES.map(async n => {
    try { const b = await raw[n]; if (b) sfx[n] = await ac.decodeAudioData(b.slice(0)); } catch (e) { console.warn('audio', n, e); }
  }));
  return decoded;
}
function play(name, vol = 1, rate = 1) {
  if (!ac || !sfx[name]) return null;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = sfx[name]; s.playbackRate.value = rate; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start();
  return s;
}
const voices = {};
function voice(ch, name, vol = 1) { // one line at a time per speaker
  try { voices[ch] && voices[ch].stop(); } catch (e) {}
  voices[ch] = play(name, vol);
}
function noiseHit(dur, f0, f1, vol, q = 0.8, type = 'bandpass') {
  if (!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise; s.loop = true; f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const sndPluck = () => noiseHit(0.035, rand(2600, 5200), 1800, 0.35, 3, 'highpass');
const sndRip = big => { noiseHit(big ? 0.34 : 0.22, 5200, 500, big ? 1.1 : 0.6, 0.7); noiseHit(0.09, 7000, 2500, 0.7, 0.5, 'highpass'); };
const sndScratch = () => { tone('sawtooth', 900, 60, 0.32, 0.3); noiseHit(0.3, 3000, 300, 0.4, 2); };
const sndSparkle = () => [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone('triangle', f, f, 0.3, 0.16, i * 0.06));
const sndSad = () => [392, 370, 349, 262].forEach((f, i) => tone('triangle', f, f * 0.97, 0.34, 0.16, i * 0.2));

/* ---------- small UI helpers ---------- */
const show = (id, on, disp = 'block') => { $(id).style.display = on ? disp : 'none'; };
function restart(el, cls) { el.className = el.className.replace(/\b(in|drop|go)\b/g, '').trim(); void el.offsetWidth; if (cls) el.classList.add(...cls.split(' ')); }
function bubble(text, scream) {
  const b = $('bubble');
  if (!text) { b.style.display = 'none'; return; }
  b.textContent = text; b.style.display = 'block';
  b.className = ''; void b.offsetWidth; b.className = scream ? 'scream' : 'in';
}
function telop(text) {
  const el = $('telop');
  if (!text) { el.style.display = 'none'; return; }
  el.textContent = text; el.style.display = 'block'; restart(el, 'in');
}
function big(text, cls = 'in') {
  const el = $('big');
  if (!text) { el.style.display = 'none'; return; }
  el.textContent = text; el.style.display = 'block'; el.className = 'abs t'; void el.offsetWidth; el.classList.add(...cls.split(' '));
}
function pop(text, x, y, size, color = '#fff', slam) {
  const s = document.createElement('span');
  s.className = 't' + (slam ? ' slam' : ''); s.textContent = text;
  s.style.cssText = `left:${x * sc}px;top:${y * sc}px;font-size:${size * sc}px;color:${color};--r0:${rand(-14, 0)}deg;--r1:${rand(-6, 8)}deg`;
  $('pops').appendChild(s); setTimeout(() => s.remove(), slam ? 1300 : 850);
}
function flash(a) {
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = a;
  requestAnimationFrame(() => { f.style.transition = 'opacity .35s'; f.style.opacity = 0; });
}

/* ---------- game state ---------- */
let state = 'title';   // title | intro | play | done
let mood = 'idle';     // idle | panic | plead | pain | relief | wreck | dead
let gen = 0;           // bumps on every restart so stale intro timers stop
let p = 0, pDrawn = 0; // peel progress 0..1
let t0 = 0;            // ms timestamp of the first tug, 0 = not started
let goAt = 0, nagged = false, screamI = 0;
let grab = null;       // {x, y, p, pull, samples}

  $('share').href = 'https://x.com/intent/post?text=' + encodeURIComponent(QUOTE_POST ? text + '\n' + URL_PUBLIC : text)

    parts.push({ k: 1, x: 200, y: armY - 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, rot: rand(0, 6.3), vr: rand(-6, 6), l: rand(6, 14), life: rand(0.6, 1.2), t: 0 });

/* ---------- input ---------- */
const stamp = e => (Math.abs(e.timeStamp - performance.now()) < 2000 ? e.timeStamp : performance.now());
const toStage = e => ({ x: (e.clientX - ox) / sc, y: e.clientY / sc });
const pullOf = (g, q) => Math.hypot(Math.max(q.x - g.x, 0), Math.max(g.y - q.y, 0)); // rightward and upward both peel
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || grab || (coast && coast.tEnd !== null)) return;
  coast = null;
  const q = toStage(e);
  if (q.y < armY - 150) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  grab = { id: e.pointerId, x: q.x, y: q.y, p, samples: [[stamp(e), 0]] };
  ptr = q;
});
cv.addEventListener('pointermove', e => {
  if (!grab || e.pointerId !== grab.id || state !== 'play') return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) {
    const q = toStage(ev), t = stamp(ev), pull = pullOf(grab, q);
    const prev = grab.samples[grab.samples.length - 1];
    ptr = q;
    if (!t0 && pull > 3) { t0 = Math.max(prev[0], t - 32); show('hint', false); }
    grab.samples.push([t, pull]); if (grab.samples.length > 12) grab.samples.shift();
    if (t0) {
      p = Math.max(p, Math.min(1, grab.p + pull * GAIN / BL));
      if (p >= 1) { finish(t); return; }
    }
  }
});
function release(e) {

  const g = grab, t = stamp(e); grab = null;
  if (state !== 'play' || !t0) return;
  // flick: keep ripping on the speed of the last 60 ms
  const s = g.samples, last = s[s.length - 1];
  let first = last; for (const q of s) if (last[0] - q[0] <= 60) { first = q; break; }
  const dt = last[0] - first[0], v = dt > 0 && t - last[0] < 80 ? (last[1] - first[1]) / dt : 0; // stage units per ms
  if (v > 0.35) {

    const reach = Math.min(Math.min(v, 8) * GAIN * TAU / BL, (p - g.p) * 8), left = 1 - p;
    coast = { t, p0: p, reach, tEnd: reach > left * 1.02 ? t - TAU * Math.log(1 - left / reach) : null };

/* ---------- drawing ---------- */
const INK = '#111', SKIN = '#eab890', HAIR = '#2b1c14';
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function line(...pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke(); }

function drawBg(t) {

  // calm mint, through yellow, to red
  const ramp = (a, b, c) => hue ? mix(a, b, hue) : k < 0.35 ? mix(a, b, k / 0.35) : mix(b, c, (k - 0.35) / 0.65);
  const c1 = ramp([165, 230, 211], [255, 225, 74], [255, 96, 80]);

    const ex = cx + s * 36, ey = cy - 4;
    if (mood === 'idle') { ctx.fillStyle = '#fff'; ell(ex, ey, 15, 15); ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ell(ex + Math.sin(t * 9) * 1.5, ey + 6, 6, 6); ctx.fill(); }
    else if (mood === 'panic') { ctx.fillStyle = '#fff'; ell(ex, ey, 21, 21); ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ell(ex, ey, 3.5, 3.5); ctx.fill(); }
    else if (mood === 'plead') { ctx.fillStyle = INK; ell(ex, ey, 17, 18); ctx.fill(); ctx.fillStyle = '#fff'; ell(ex - 5, ey - 6, 6, 6); ctx.fill(); ell(ex + 6, ey + 5 + Math.sin(t * 12) * 1.5, 3.5, 3.5); ctx.fill(); }
    else if (mood === 'pain') { ctx.lineWidth = 6; line(ex - s * 13, ey - 11, ex + s * 11, ey, ex - s * 13, ey + 11); ctx.lineWidth = 5; }
    else if (mood === 'relief') { ctx.fillStyle = INK; ell(ex, ey, 5.5, 5.5); ctx.fill(); }
    else if (mood === 'wreck') { ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(ex, ey + 4, 12, 3.4, 6.03); ctx.stroke(); ctx.lineWidth = 5; }
    else { ctx.lineWidth = 6; line(ex - 10, ey - 10, ex + 10, ey + 10); line(ex + 10, ey - 10, ex - 10, ey + 10); ctx.lineWidth = 5; }
    // tears
    if ((mood === 'pain' && hurt > 0.2) || mood === 'wreck') {
      const w = mood === 'wreck' ? 9 : 5 + hurt * 9;
      ctx.fillStyle = '#6cc4ff'; ctx.beginPath();
      ctx.moveTo(ex - w / 2, ey + 12);
      for (let y = 0; y <= 70; y += 10) ctx.lineTo(ex - w / 2 + Math.sin(t * 20 + y * 0.3) * 2 + s * y * 0.12, ey + 12 + y);
      for (let y = 70; y >= 0; y -= 10) ctx.lineTo(ex + w / 2 + Math.sin(t * 20 + y * 0.3) * 2 + s * y * 0.12, ey + 12 + y);
      ctx.closePath(); ctx.fill(); ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 5;
    }
  }
  // nose
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx - 4, cy + 4); ctx.quadraticCurveTo(cx - 14, cy + 24, cx + 4, cy + 24); ctx.stroke();
  // mouth
  const mx = cx, my = cy + 50;
  if (mood === 'idle') { ctx.beginPath(); ctx.moveTo(mx - 22, my); for (let i = 1; i <= 8; i++) ctx.lineTo(mx - 22 + i * 5.5, my + (i % 2 ? -4 : 4) * (0.7 + 0.3 * Math.sin(t * 14))); ctx.stroke(); }
  else if (mood === 'panic') { ctx.fillStyle = '#4a1418'; ell(mx, my + 4, 24, 28); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ff7a7a'; ell(mx, my + 20, 13, 9); ctx.fill(); }
  else if (mood === 'plead') { line(mx - 12, my + 6, mx, my - 3 + Math.sin(t * 16) * 1.5, mx + 12, my + 6); }
  else if (mood === 'pain') {
    const w = 46 + hurt * 34, h = 18 + hurt * 46;
    rr(mx - w / 2, my - 12, w, h, Math.min(16, h / 2)); ctx.fillStyle = '#4a1418'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(mx - w / 2, my - 12, w, 9); ctx.fillStyle = '#ff7a7a'; ell(mx, my - 12 + h, w * 0.32, h * 0.3); ctx.fill(); ctx.restore();
    rr(mx - w / 2, my - 12, w, h, Math.min(16, h / 2)); ctx.stroke();
  }
  else if (mood === 'relief') { ctx.fillStyle = '#4a1418'; ell(mx, my, 7, 9); ctx.fill(); ctx.stroke(); }
  else if (mood === 'wreck') { ctx.beginPath(); ctx.moveTo(mx - 24, my + 8); ctx.quadraticCurveTo(mx - 12, my - 10 + Math.sin(t * 22) * 3, mx, my + 2); ctx.quadraticCurveTo(mx + 12, my - 10 - Math.sin(t * 22) * 3, mx + 24, my + 8); ctx.stroke(); }
  else {
    ctx.fillStyle = '#4a1418'; ell(mx, my + 2, 13, 10); ctx.fill(); ctx.stroke();
    // soul
    const sy = cy - 30 - ((t * 26) % 60), sx = mx + 78 + Math.sin(t * 2.5) * 8;
    ctx.globalAlpha = 0.9; ctx.fillStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(mx + 10, my); ctx.quadraticCurveTo(mx + 60, my + 6, sx - 10, sy + 26); ctx.quadraticCurveTo(sx - 30, sy - 4, sx, sy - 22);
    ctx.quadraticCurveTo(sx + 30, sy - 4, sx + 12, sy + 24); ctx.quadraticCurveTo(mx + 66, my + 26, mx + 10, my); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ell(sx - 8, sy - 2, 3, 4); ctx.fill(); ell(sx + 8, sy - 2, 3, 4); ctx.fill(); ell(sx, sy + 9, 4, 5); ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = 5;
  }
  // sweat
  if (mood === 'idle' || mood === 'plead' || mood === 'panic') {
    ctx.fillStyle = '#8fd4ff'; ctx.lineWidth = 3;
    const n = mood === 'panic' ? 4 : 2;
    for (let i = 0; i < n; i++) {
      const s = i % 2 ? 1 : -1, yy = ((t * 40 + i * 23) % 46), x = cx + s * (66 + i * 5), y = cy - 46 + yy;
      ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.quadraticCurveTo(x + 8, y + 5, x, y + 7); ctx.quadraticCurveTo(x - 8, y + 5, x, y - 9); ctx.fill(); ctx.stroke();
    }
  }
  // anger vein when it hurts a lot
  if (mood === 'pain' && hurt > 0.45) {
    ctx.strokeStyle = '#e8392b'; ctx.lineWidth = 5; const vx = cx + 52, vy = cy - 66, q = 9 + Math.sin(t * 30) * 2;
    line(vx - q, vy - 3, vx - 3, vy - 3, vx - 3, vy - q); line(vx + q, vy - 3, vx + 3, vy - 3, vx + 3, vy - q);
    line(vx - q, vy + 3, vx - 3, vy + 3, vx - 3, vy + q); line(vx + q, vy + 3, vx + 3, vy + 3, vx + 3, vy + q);
  }
}

function bandageBody(x, y, w, h) { // generic strip centred on y, used for the flying one
  rr(x, y - h / 2, w, h, 14); ctx.fillStyle = '#f0c49a'; ctx.fill(); ctx.stroke();
  rr(x + w * 0.32, y - h / 2 + 5, w * 0.36, h - 10, 6); ctx.fillStyle = '#fff3e2'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
}

function drawArm(t) {
  const xf = X0 + pDrawn * BL, top = armY - 108;
  ctx.lineJoin = ctx.lineCap = 'round';
  // panel
  ctx.fillStyle = INK; rr(12, top + 7, 376, 216, 20); ctx.fill();
  rr(12, top, 376, 216, 20); ctx.fillStyle = '#fff8e6'; ctx.fill();
  ctx.save(); rr(12, top, 376, 216, 20); ctx.clip();
  // arm
  ctx.fillStyle = SKIN; ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, armY - 72); ctx.quadraticCurveTo(200, armY - 66, 400, armY - 58); ctx.lineTo(400, armY + 58); ctx.quadraticCurveTo(200, armY + 68, 0, armY + 72); ctx.closePath(); ctx.fill(); ctx.stroke();
  // hair
  ctx.strokeStyle = HAIR; ctx.lineWidth = 2.4; ctx.beginPath();
  for (const h of hairs) {
    if (h.under) continue;
    const x = h.x, y = armY + h.y, ex = x + Math.cos(h.a) * h.l, ey = y + Math.sin(h.a) * h.l;
    ctx.moveTo(x, y); ctx.quadraticCurveTo((x + ex) / 2 + h.c, (y + ey) / 2, ex, ey);
  }
  ctx.stroke();
  // bare patch where the bandage was
  if (pDrawn > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, armY - 60, xf, 120); ctx.clip();
    rr(X0, armY - BH / 2, BL, BH, 14); ctx.fillStyle = mix([255, 214, 196], [255, 150, 130], state === 'done' ? pain : painShown); ctx.fill();
    ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(160,60,40,.6)'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(200,50,40,.7)'; for (const q of pores) { ell(X0 + q[0], armY + q[1], 1.6, 1.6); ctx.fill(); }
    ctx.restore();
  }
  // bandage still stuck
  if (pDrawn < 1) {
    ctx.save(); ctx.beginPath(); ctx.rect(xf, armY - 60, 400, 120); ctx.clip();
    ctx.strokeStyle = INK; ctx.lineWidth = 4; bandageBody(X0, armY, BL, BH);
    ctx.fillStyle = 'rgba(120,70,30,.45)';
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { ell(X0 + 22 + i * 17, armY - 15 + j * 15, 2, 2); ctx.fill(); ell(X0 + BL - 22 - i * 17, armY - 15 + j * 15, 2, 2); ctx.fill(); }
    ctx.restore();
    if (pDrawn > 0) { ctx.strokeStyle = INK; ctx.lineWidth = 4; line(xf, armY - BH / 2, xf, armY + BH / 2); }
  }
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 5; rr(12, top, 376, 216, 20); ctx.stroke();

  // the peeled end, pulled toward the finger
  if (pDrawn < 1 && state !== 'title') {
    const len = pDrawn * BL + 34;
    let tx, ty;
    if (grab) { const dx = ptr.x - 8 - xf, dy = Math.min(ptr.y, armY) - 62 - armY, d = Math.hypot(dx, dy) || 1, k = Math.min(1, len / d); tx = xf + dx * k; ty = armY + dy * k; }
    else { const k = Math.min(1, len / 70), w = state === 'play' && !t0 ? Math.sin(t * 9) * 5 : Math.sin(t * 3) * 2; tx = xf - (16 + w) * k; ty = armY - 64 * k; }
    tip.x += (tx - tip.x) * 0.5; tip.y += (ty - tip.y) * 0.5;
    const d = Math.hypot(tip.x - xf, tip.y - armY), cxp = xf + (tip.x - xf) * 0.15, cyp = armY - Math.max(20, d * 0.55);
    if (state === 'play' && !t0) { ctx.globalAlpha = 0.5 + 0.4 * Math.sin(t * 9); ctx.fillStyle = '#ffe14a'; ell(tip.x, tip.y, 34, 34); ctx.fill(); ctx.globalAlpha = 1; }
    for (const [w, c] of [[44, INK], [36, '#fbe3c8']]) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(xf, armY); ctx.quadraticCurveTo(cxp, cyp, tip.x, tip.y); ctx.stroke(); }
    // hairs stuck to the sticky side
    ctx.strokeStyle = HAIR; ctx.lineWidth = 2; ctx.beginPath();
    const n = Math.floor(pDrawn * 26);
    for (let i = 0; i < n; i++) {
      const k = (i + 0.5) / n, a = 1 - k, bx = a * a * xf + 2 * a * k * cxp + k * k * tip.x, by = a * a * armY + 2 * a * k * cyp + k * k * tip.y, o = ((i * 37) % 24) - 12;
      ctx.moveTo(bx + o, by + o * 0.3); ctx.lineTo(bx + o + 5, by + o * 0.3 - 7);
    }
    ctx.stroke();
  }
}

function drawParts() {
  ctx.lineCap = 'round';
  for (const q of parts) {
    const a = clamp(1 - q.t / q.life, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 2.5);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
    if (q.k === 0) { ctx.strokeStyle = HAIR; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-q.l / 2, 0); ctx.quadraticCurveTo(0, q.c, q.l / 2, 0); ctx.stroke(); }
    else if (q.k === 1) {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath();
      for (let i = 0; i < 8; i++) { const r = i % 2 ? q.l * 0.4 : q.l, an = i * 0.7854; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else { ctx.fillStyle = '#6cc4ff'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ell(0, 0, q.l * 0.7, q.l); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  if (flyer) {
    ctx.save(); ctx.translate(flyer.x, flyer.y); ctx.rotate(flyer.rot); ctx.scale(0.8, 0.8);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; bandageBody(-BL / 2, 0, BL, BH);
    ctx.strokeStyle = HAIR; ctx.lineWidth = 2.4; ctx.beginPath();
    for (let i = 0; i < 40; i++) { const x = -BL / 2 + 10 + (i * 53 % (BL - 20)), y = ((i * 29) % (BH - 12)) - BH / 2 + 6; ctx.moveTo(x, y); ctx.lineTo(x + 5, y - 9); }
    ctx.stroke(); ctx.restore();
  }
}

/* ---------- loop ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016); lastTime = now;
  const t = now / 1000;

  if (state === 'play') {
    if (coast) {
      const e = now - coast.t;
      if (coast.tEnd !== null && now >= coast.tEnd) finish(coast.tEnd);
      else { p = Math.max(p, Math.min(coast.tEnd !== null ? 0.999 : 1, coast.p0 + coast.reach * (1 - Math.exp(-e / TAU)))); if (coast.tEnd === null && e > TAU * 4) coast = null; }
    }
    if (t0 && state === 'play') {
      const el = (now - t0) / 1000;
      pain = painOf(el); mood = 'pain';
      $('time').firstChild.nodeValue = fmt(el);
      if (screamI < SCREAMS.length && el >= SCREAMS[screamI][0]) {
        const s = SCREAMS[screamI++]; voice('m', s[1]); bubble(s[2], true); shake = Math.max(shake, 10 + screamI * 3);
      }
      if (el >= FAINT_AT) finish(now, true);
    } else if (!nagged && now - goAt > 5000) { nagged = true; mood = 'plead'; bubble('は、早く…ひとおもいに…！'); }
  }

  // peel feedback: every bit of travel plucks hair
  if (p > pDrawn) {
    const dpx = (p - pDrawn) * BL, xf = X0 + p * BL, quick = dpx / dt > 900;
    pDrawn = p;
    for (let i = Math.min(40, Math.ceil(dpx * 0.45)); i > 0; i--) hairPart(xf - rand(0, dpx), armY + rand(-BH / 2, BH / 2), quick ? 0.8 : 0.15);
    pluckAcc += dpx; let n = 0;
    while (pluckAcc > 8) { pluckAcc -= 8; if (n++ < 3) sndPluck(); }
    if (state === 'play') {
      popAcc += dpx;
      if (popAcc > 26 && !quick) { popAcc = 0; pop(['プチ', 'ブチッ', 'ミチ…', 'ブチブチ', 'プチッ'][Math.floor(rand(0, 5))], xf + rand(-20, 20), armY - rand(60, 100), rand(22, 32), '#fff'); shake = Math.max(shake, 5); }
      if (pain > 0.2 && Math.random() < 0.5) tear(Math.random() < 0.5 ? -1 : 1);
    }
  }
  if (state === 'play' && t0 && pain > 0.35 && Math.random() < pain * 0.5) tear(Math.random() < 0.5 ? -1 : 1);
  if (state === 'done' && mood === 'wreck' && Math.random() < 0.15) tear(Math.random() < 0.5 ? -1 : 1);

  painShown += (pain - painShown) * Math.min(1, dt * 10);
  if (state === 'play') $('gfill').style.width = painShown * 100 + '%';

  // particles
  if (freeze > 0) freeze -= dt;
  else {
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.t += dt;
      if (q.t > q.life || q.y > SH + 40) { parts.splice(i, 1); continue; }
      q.vy += (q.k === 0 ? 520 : 900) * dt; if (q.k === 0) { q.vx *= 1 - 1.6 * dt; q.vy *= 1 - 1.2 * dt; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    }
    if (flyer) { flyer.vy += 1500 * dt; flyer.x += flyer.vx * dt; flyer.y += flyer.vy * dt; flyer.rot += flyer.vr * dt; if (flyer.y > SH + 300) flyer = null; }
  }

  // shake
  const amp = shake + (state === 'play' && t0 ? painShown * 5 : 0);
  shake *= Math.exp(-dt * 8); if (shake < 0.3) shake = 0;
  const sx = rand(-amp, amp) * sc, sy = rand(-amp, amp) * sc;
  ui.style.transform = amp ? `translate(${sx}px,${sy}px)` : '';

  drawBg(t);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, (ox + sx) * dpr, sy * dpr);
  drawGuy(t); drawArm(t); drawParts();
  requestAnimationFrame(frame);
}

const Q = new URLSearchParams(location.search), CQ = Q.get('card');
const CARD = !Q.has('card') ? undefined : !CQ ? null : CQ === 'max' ? '10秒以上' : CQ[0] === 's' ? `${CQ.slice(1)}秒台` : CQ[0] === 'd' ? `${(CQ.slice(1) / 10).toFixed(1)}秒台` : `${(CQ.slice(1) / 100).toFixed(2)}秒`;
requestAnimationFrame(frame);
if (CARD === undefined) { show('title', true); show('start', true); bubble('毛深井です…お手やわらかに…'); }
else if (CARD === null) { mood = 'dead'; state = 'done'; p = pDrawn = 1; pain = painShown = 1; setTimeout(async () => showPicture(await drawShareImage({ card: null })), 1200); }
else {   // play the ending for this card's time, then draw the preview
  const secs = CQ === 'max' ? 10 : { s: 1, d: .1, c: .01 }[CQ[0]] * CQ.slice(1);
  state = 'play'; t0 = 1000; finish(1000 + secs * 1000);
}
</script>
